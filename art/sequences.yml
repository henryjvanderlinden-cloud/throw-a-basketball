# The sequences every character gets.
#
# This file is the shared skeleton. Nothing in it names a character: anything
# that would — a tail, a torn jersey, which hand dribbles — enters through a
# {placeholder} resolved from that character's `traits` map in characters.yml.
# An undefined or empty trait renders as nothing and the surrounding whitespace
# is tidied, so a character with no tail simply gets a shorter sentence.
#
# Character-specific sequences (idle breaks, the showpiece celebration) are not
# here. They live in each character's own `sequences:` block in characters.yml
# and use exactly this schema.
#
# Field reference:
#   kind        loop | one_shot        picks the closing clause
#   frames      integer                cells NOT counting the calibration frame
#   ref         front | back           which reference image to attach
#   travelling  bool                   anchored on the cell, not the feet
#   airborne    bool                   suppresses the ground-line check
#   view        VIEW: clause body
#   preamble    optional mood paragraph, sits between VIEW and FRAMES
#   critical    optional CRITICAL: block, for failures seen in practice
#   ground      optional override of the shared ground-line clause
#   poses       one entry per frame, in order
#   closing     optional override of the kind's default closing clause
#   extra       optional trailing sentence(s) before the ball clause
#   ball        optional override of the ball clause
#
# `panic` used to live here with a {panic_face} trait, but the four characters
# panic in genuinely different ways -- the NBA player is unbothered, the zombie
# is slow and wrong -- so it is now one of each character's OWN sequences.

defaults:

  # Repeated verbatim in every prompt. The wording is not decorative: each
  # clause heads off a failure seen in the monkey's generations.
  header: |
    Pixel-art sprite sheet, single image, fully transparent background.

  calibration: |
    1. CALIBRATION POSE: standing straight upright, feet shoulder-width apart,
       arms hanging relaxed at his sides, facing the viewer, in the plain
       neutral standing pose from the reference image. This exact pose appears
       as the first frame of every sheet in this set and must be drawn
       identically every time.

  camera: |
    CAMERA: locked off. Identical distance and eye level in every frame. The
    character must be exactly the same height in every frame, and the same
    height as in the reference image — do not zoom, crop, recompose or rescale
    between frames.

  ground: |
    All frames share one ground line: the soles of the feet touch the same
    horizontal line in every frame.

  # "16-bit arcade" was too vague and the output drifted smooth -- soft
  # gradients, many tones, anti-aliased edges: a modern illustration with a
  # pixel filter over it. These clauses are the ones that actually change what
  # comes back: a hard tone count, dither instead of blending, and no
  # anti-aliasing anywhere.
  style: |
    STYLE: VGA-era 256-colour DOS-game pixel art, drawn pixel by pixel — NOT a
    modern illustration with a pixel filter over it. The limits below are the
    look; keep all of them:

    - At most THREE tones per material: a base, one darker shadow, one lighter
      highlight. Hard edges between the tones.
    - NO gradients, NO soft or airbrushed shading, NO glow, NO bloom, and NO
      anti-aliasing anywhere — not on the outline, not between tones, not
      around the silhouette.
    - Where a tone change needs softening, use visible ORDERED DITHER — a
      checkerboard of the two tones. Dither, never blend.
    - Chunky square pixels on one consistent grid, plainly visible at full
      size.
    - A bold dark outline around the silhouette and around the major forms
      inside it.

    The background must be fully transparent (alpha 0) with no haze, glow or
    soft fringe around the silhouette. Output a wide landscape image.

  ball: |
    The character is NOT holding a basketball in any frame — the ball is drawn
    separately by the game.

  # Sent only for a sequence that has a `guide:`. It names the two attached
  # images by what they LOOK like rather than by the order they were attached,
  # because the order is the one thing about the upload we do not control.
  guide_note: |
    POSE GUIDE: TWO images are attached, and they do different jobs.

    The COLOUR image of the character is the only authority on WHO HE IS. His
    colours, his proportions, his build, his height, his face, his kit and the
    drawing style all come from that image and from the SUBJECT above, and
    nothing below changes any of them.

    The other image is a POSE GUIDE: a plain black stick figure on a white
    background, five figures standing in a row on one ground line, in the same
    left-to-right order as the FRAMES listed below. The Nth figure in the pose
    guide is the pose for the Nth frame. Take the GEOMETRY from it and only the
    geometry: where each foot stands on the ground line, how deeply each knee
    is bent and which knee is bent more than the other, how far the shoulder
    line is tilted away from level, how far his spine leans away from upright,
    how high the dribbling hand is and how far
    out from his centre line it reaches, and how far the head is tilted. Where
    the words below and the pose guide describe the same thing, they agree; the
    pose guide is the exact version of it.

    THE HANDS ON THE POSE GUIDE are drawn too. The FLAT hand with its fingers
    spread out sideways is the dribbling hand: palm to the floor, at exactly
    that height and that angle. The NARROW hand with its fingers pointing down
    at the floor is the free hand, palm turned in toward his leg. Each is ONE
    drawing, moved from frame to frame, and so is his.

    THE SHORT LINES ON THE POSE GUIDE'S HEAD show which way his hair points in
    that frame: standing straight up off his scalp, lying down flat along the
    sides of his head, or sticking out at rest. Draw HIS OWN ragged brown hair
    pointing the way those lines point. The lines are a direction, not hair.

    Draw the character from the colour reference standing in those positions.
    The pose guide is an instruction, not artwork: its thin flat lines, its
    joint dots, its white background, its blank circular head and its missing
    face are NOT part of the drawing and must not appear anywhere in it.

  closing_loop: |
    This row is a seamless loop: frame {last} must flow back into frame
    {first} with no jump.

  closing_one_shot: |
    This is a one-shot, not a loop. Frame {first} must continue naturally from
    a low athletic standing stance, and frame {last} must settle back into that
    same stance.


sequences:

  # --- constantly on screen ------------------------------------------------

  dribble_idle:
    title: Stationary dribble
    # The pose guide, as numbers. tools/make-pose-guide.py draws the picture
    # from this table (its FRAME_FIELDS lists every field); gen-strips.py
    # attaches `file`. All lengths are fractions of standing height.
    #
    # SUBTLE, face-on, ball on the viewer's LEFT (Rick, 2026-09-25). The earlier
    # table (crouch 0.016-0.150, hand 0.26-0.52, head up to 9 deg, hair up and
    # flat) asked for about six times the monkey's movement: his dribble_idle
    # changes height by ~2% across the loop, and every zombie take changed it
    # by 6-8%. Rick: "too stiff, primarily because it is too exaggerated". The
    # crouch now holds at 0.095-0.12, the stance matches the ball-less idle's
    # (0.27) so he keeps his footing between the two, and the hand tops out at
    # 0.42 -- DRIBBLE_HAND_H in index.html, where the ball actually peaks; the
    # old 0.52 put the hand above the ball. Hair stays at rest.
    #
    # Face-on: every earlier take copied the reference drawing's three-quarter
    # turn toward the viewer's right, so stopping after a run to the left
    # turned his head the wrong way. Nose and both ears on the guide, as the
    # ball-less idle has them, and the note says what they mean.
    #
    # History: take32 (handover 03) was the four-frame original; the face-on
    # r3 was tried as a two-frame loop (its frames 2 and 3) and judged stiff.
    guide:
      file: art/guides/dribble_idle.png
      side: left
      ears: true
      nose: true
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The COLOUR image of the character is the only authority on WHO HE IS.
        His colours, his proportions, his build, his height, his face, his kit
        and the drawing style all come from that image and from the SUBJECT
        above, and nothing below changes any of them. It does NOT decide which
        way he faces: in that drawing he is turned toward the right edge, and
        in this sheet he is not.

        The other image is a POSE GUIDE: a plain black stick figure on a white
        background, five figures standing in a row on one ground line, in the
        same left-to-right order as the FRAMES listed below. The Nth figure in
        the pose guide is the pose for the Nth frame. Take the GEOMETRY from it
        and only the geometry: where each foot stands on the ground line, how
        deeply the knees are bent, how far the shoulder line is tilted, how high
        the dribbling hand is and how far out from his centre line it reaches,
        and which way his face points. Where the words below and the pose guide
        describe the same thing, they agree; the pose guide is the exact version
        of it. The four dribbling figures are MEANT to look almost alike: the
        differences between them are small, and they should stay small.

        THE HANDS ON THE POSE GUIDE are drawn too. The FLAT hand with its
        fingers spread out sideways is the dribbling hand: palm to the floor, at
        exactly that height. The NARROW hand with its fingers pointing down at
        the floor is the free hand, palm turned in toward his leg. Each is ONE
        drawing, moved from frame to frame.

        THE HEAD ON THE POSE GUIDE: the small TRIANGLE in the middle of the
        face, pointing straight down, is his nose, and the two small ovals on
        either side of the head are BOTH of his ears. His face points STRAIGHT
        OUT OF THE PICTURE AT THE VIEWER in every frame: nose in the middle of
        his face, both eyes seen, both ears showing equally. The upright line
        down the face marks its centre and the level line his eyes. The short
        lines on top are his hair, at rest.

        Draw the character from the colour reference standing in those
        positions. The pose guide is an instruction, not artwork: its thin flat
        lines, its joint dots, its white background, its circular head, its
        triangle, its ovals and its face lines are NOT part of the drawing and
        must not appear anywhere in it.
      frames:
        - {pose: calibration}
        - {name: lowest,  drop: 0.120, tilt: 0.010, lean: 0.012, stance: 0.27,
           hand: 0.30, head: 3, palm: 8}
        - {name: rising,  drop: 0.105, tilt: 0.005, lean: 0.006, stance: 0.27,
           hand: 0.35, head: 1.5}
        - {name: highest, drop: 0.095, tilt: 0.000, lean: 0.000, stance: 0.27,
           hand: 0.42, head: 0}
        # the hand trails the body on the way down, as before, but by less
        - {name: driving, drop: 0.112, tilt: 0.006, lean: 0.008, stance: 0.27,
           hand: 0.39, head: 1.5}
    kind: loop
    frames: 4
    ref: front
    view: |
      front view, facing the viewer, squared to camera: his chest, his hips and
      his face all point straight out of the picture, both shoulders the same
      distance from the camera, the number on his jersey in the middle of his
      chest. A relaxed, low athletic stance: knees bent, feet planted a little
      wider than his shoulders, holding that crouch steadily.
    critical: |
      CRITICAL: exactly ONE hand dribbles — the hand nearer the LEFT EDGE of the
      picture, on the VIEWER'S LEFT — in all four frames. The other hand never
      dribbles.

      THIS IS A CALM, EASY DRIBBLE, AND HIS BODY HARDLY MOVES. He holds one
      steady low crouch in all four frames: his head sits at almost the same
      height in every frame, his shoulders stay almost level, his back stays
      almost upright. The only thing that plainly moves is the dribbling
      FOREARM AND HAND, bouncing the ball from the elbow and the wrist. Keep
      every other difference between the frames SMALL — a slight dip, a slight
      rise — never a lunge, a heave or a deep knee bend.

      THE DRIBBLING HAND is flat and open: palm facing DOWN at the floor,
      fingers spread and straight, the shape of a hand resting on the top of a
      ball. DRAW THE SAME HAND FOUR TIMES — the same shape, the same spread of
      the fingers, the same angle to the floor — simply moved up and down from
      frame to frame. It travels in one short straight line OUTSIDE HIS HIP,
      beside his thigh, with clear background between his forearm and his
      jersey.

      THE HAND'S FOUR HEIGHTS, IN ORDER, all of them low: in the LOWEST frame it
      is beside his KNEE; in the RISING frame it is a little higher, on his
      LOWER THIGH; in the HIGHEST frame it is just ABOVE THE HEM of his shorts,
      and never higher than that; in the DRIVING DOWN frame it is level with the
      HEM. Each frame has the hand at a DIFFERENT height, but the whole travel
      is short: from the knee to just above the hem, and no further.

      THE FREE HAND IS NOT DRIBBLING AND DOES NOT COPY IT. That arm simply
      hangs: upper arm against his ribs, elbow almost straight, and the hand
      hanging from the wrist with the PALM TURNED IN toward his thigh, fingers
      straight, relaxed and a little apart, pointing down at the floor. It is
      ONE DRAWING REPEATED IN ALL FOUR FRAMES, held just clear of his leg so
      the whole hand shows against the background. {no_shamble}

      HIS FEET ARE ONE DRAWING REPEATED IN ALL FOUR FRAMES: both shoes in the
      same place on the floor, the same distance apart, at the same angle, as
      if traced from one frame into the next three. The small dip and rise
      come from his knees, never from moving his feet.

      HE LOOKS STRAIGHT AT THE VIEWER IN ALL FOUR FRAMES: both eyes seen, his
      nose in the middle of his face, both ears showing. The character
      reference shows him turned toward the RIGHT edge with his head in
      profile; that is how he stood for that drawing, NOT this pose, so do not
      copy the turn. His head never turns toward the dribbling hand or toward
      either edge of the picture. At most it tips a hair toward the dribbling
      side in the LOWEST frame. His hair is the same, at rest, in every frame.
    poses:
      - >-
          LOWEST, the push landed. The dribbling hand is at its lowest, beside
          his KNEE, arm almost straight, wrist loose. He has dipped a little
          into his crouch, the shoulder on the dribbling side a touch lower
          than the other. The free hand hangs at his side.
      - >-
          RISING. The hand has come up a little, to his LOWER THIGH, the elbow
          starting to bend. His body is almost exactly as in the LOWEST frame,
          a touch less dipped. The free hand hangs at his side.
      - >-
          HIGHEST. The hand is at the top of its short travel, just ABOVE THE
          HEM of his shorts, elbow bent, ready to push down again. His
          shoulders are level and his crouch is at its shallowest, but he is
          still in the same low athletic stance. His head is level, looking
          straight at the viewer. The free hand hangs at his side.
      - >-
          DRIVING DOWN. His knees give a little and the hand pushes down,
          still level with the HEM, following the body down. Almost the same
          pose as the RISING frame, with the hand a little higher. The free
          hand hangs at his side.
    extra: |
      The four frames are nearly the same picture with the dribbling forearm
      and hand at four different heights and his body dipping and rising only
      slightly. Subtle, relaxed, steady: this is how he waits with the ball.

  run_dribble_r:
    title: Run-dribble, moving right
    # DRAFT pose guide, not yet rolled. x is toward the dribbling side, which
    # here is also FORWARD (he runs toward the right edge, ball ahead of him).
    # Contact, passing, contact, passing: each leg plants in front, passes
    # under the body with the other knee driving through, and trails behind.
    # The free arm swings against its own leg, as a fist. The hand
    # reaches the game's apex, 0.52, on the passing frames; its low point is
    # 0.36 -- lower than that is out of reach without a deep crouch (see the
    # stretch check in make-pose-guide.py). Each foot is placed from its OWN
    # hip (+-0.058 at turn 50): front foot 0.14 ahead of it, trailing foot
    # 0.17 behind, driving knee 0.16 ahead -- so the free-side leg's frames sit
    # further back in the picture than the dribbling-side leg's. Stride and hand are reference-
    # free: the zombie has no run art, and the monkey's never lowers his hand.
    guide:
      file: art/guides/run_dribble_r.png
      side: right
      colors: true              # limbs colour-coded: the two legs cross
      ears: true
      # The shared guide_note tells the two images apart as "the COLOUR image"
      # and "a black stick figure", which a coloured guide makes ambiguous, and
      # colour brings a failure the black guide did not have: the limb colours
      # bleeding into the art. So this guide describes itself.
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The CHARACTER REFERENCE -- the finished pixel-art drawing of the
        character -- is the only authority on WHO HE IS. His colours, his
        proportions, his build, his height, his face, his kit and the drawing
        style all come from that image and from the SUBJECT above, and nothing
        below changes any of them.

        The other image is a POSE GUIDE: a stick-figure diagram on a plain white
        background, five figures in a row on one ground line, in the same
        left-to-right order as the FRAMES listed below. The Nth figure in the
        pose guide is the pose for the Nth frame. Take the GEOMETRY from it and
        only the geometry: where each foot is, which foot is on the ground line
        and which is lifted, how each knee is bent, the angle of each shoe, how
        far his body leans forward and how his back curves, how the shoulder
        line tilts, how high the dribbling hand is and how far ahead of him it
        reaches, where the swinging free hand is, and which way his head is turned.
        Where the words below and the pose guide describe the same thing, they
        agree; the pose guide is the exact version of it.

        THE COLOURS ON THE POSE GUIDE ONLY TELL THE LIMBS APART, so that where
        his legs cross you can see which is which. He runs toward the right edge
        with his chest turned toward the viewer, so his dribbling side is the
        side FURTHER from the viewer: RED is the dribbling arm, reaching ahead
        of him on the far side of his body; ORANGE is the leg on that same far
        side; BLUE is the free arm, on the side NEARER the viewer; GREEN is the
        leg on that near side. None of these colours belongs in the drawing:
        his skin, his kit and his shoes keep exactly the colours of the
        character reference.

        THE HANDS ON THE POSE GUIDE: the FLAT hand with its fingers spread is
        the dribbling hand, palm to the floor, at exactly that height. The
        small closed square at the end of the blue arm is the free hand, a loose
        fist, swinging as he runs. The dribbling hand never pumps like a
        sprinter's: it stays out ahead of him, pushing the ball down.

        THE HEAD ON THE POSE GUIDE: the curved line down the face shows which
        way he is looking -- toward the side it bulges to, the way he is
        running. The small oval is the ear that shows. The short lines on top
        are his hair sticking out at rest.

        Draw the character from the reference running through those positions.
        The pose guide is an instruction, not artwork: its thin lines, its
        colours, its joint dots, its white background and its blank circular
        head are NOT part of the drawing and must not appear anywhere in it.
      frames: &run_guide_frames
        - {pose: calibration}
        # Contact: the dribbling-side foot lands in front, the other foot
        # toes off behind. The hand is at its low point, so the dribbling
        # shoulder dips with it -- the shoulders see-saw against the hips.
        - name: contact-dribble-side
          drop: 0.08
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: 0.025
          hip_tilt: 0.0
          hand: 0.36
          palm: 12
          free: [0.02, 0.52]
          free_shape: fist
          joints: {ank_d: [0.20, 0.09], ank_f: [-0.23, 0.20], knee_f: [-0.11, 0.26]}
          feet: {d: -5, f: 45}
        # Passing: the dribbling-side foot is under him, the other knee drives
        # through.
        # The hand meets the ball at the game's apex; the swinging leg's hip
        # dips.
        - name: passing-dribble-side
          drop: 0.10
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: -0.015
          hip_tilt: -0.015
          hand: 0.52
          free: [-0.12, 0.42]
          free_shape: fist
          joints: {ank_d: [0.02, 0.09], ank_f: [-0.06, 0.22], knee_f: [0.10, 0.30]}
          feet: {d: 0, f: 30}
        - name: contact-free-side
          drop: 0.08
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: 0.025
          hip_tilt: 0.0
          hand: 0.36
          palm: 12
          free: [-0.20, 0.48]
          free_shape: fist
          joints: {ank_f: [0.08, 0.09], ank_d: [-0.11, 0.20], knee_d: [0.01, 0.26]}
          feet: {f: -5, d: 45}
        - name: passing-free-side
          drop: 0.10
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: -0.015
          hip_tilt: 0.015
          hand: 0.52
          free: [-0.12, 0.42]
          free_shape: fist
          joints: {ank_f: [-0.10, 0.09], ank_d: [0.06, 0.22], knee_d: [0.22, 0.30]}
          feet: {f: 0, d: 30}
    kind: loop
    frames: 4
    ref: front
    travelling: true
    ground: |
      All frames share one ground line: the sole of the planted foot touches the
      same horizontal line in every frame.
    view: |
      three-quarter view, running toward the right of frame, chest turned
      slightly toward the viewer so the jersey number stays readable.
      {trail_left}
    critical: |
      CRITICAL: he is DRIBBLING A BASKETBALL WHILE HE RUNS — this is not a plain
      sprint. The hand on the VIEWER'S RIGHT is the dribbling hand in frames
      {first} to {last}. It is always held out in front of his body with the
      palm facing DOWN toward the floor, fingers spread, pushing an invisible ball
      down. It is never a fist, never swung back, and never tucked in at his
      side. The OTHER arm does the running, swinging freely.
    # Worded to agree with the guide: the hand's low point is the HEM, its
    # high point the WAISTBAND (the game's apex), and the free arm swings
    # against its own leg -- forward when the far leg trails.
    poses:
      - >-
          Dribbling hand pushed down to the hem of his shorts, palm flat to
          the floor. Legs: the leg on the dribbling side forward and planted,
          the other leg stretched out behind him, its toe pushing off. Free
          arm swung forward across his chest.
      - >-
          Dribbling hand risen to the waistband of his shorts, palm still
          down. Legs mid-stride: the planted foot under his body, the other
          knee driving forward past it. Torso leaning forward.
      - >-
          Dribbling hand pushed down to the hem of his shorts again, palm flat
          down. Legs: the other leg forward and planted, the leg on the
          dribbling side stretched out behind him, its toe pushing off. Free
          arm swung back behind him.
      - >-
          Dribbling hand risen to the waistband of his shorts, palm down. Legs
          mid-stride the other way: the planted foot under his body, the knee
          on the dribbling side driving forward past it.
    ball: |
      The character is NOT holding a basketball in any frame — the ball is drawn
      separately by the game. His hand pushes down as if a ball were there.

  run_dribble_l:
    title: Run-dribble, moving left
    # The same guide as run_dribble_r, mirrored: `side: left` flips the drawing,
    # and the frame table is shared through a YAML anchor so the two directions
    # cannot drift apart. Only the note differs, because it names the edge he
    # runs toward. His jersey number is why this is generated rather than made
    # by mirroring the right-hand strip: mirrored, the 13 would read backwards.
    guide:
      file: art/guides/run_dribble_l.png
      side: left
      colors: true
      ears: true
      nose: true                # all three of the first rolls looked RIGHT
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The CHARACTER REFERENCE -- the finished pixel-art drawing of the
        character -- is the only authority on WHO HE IS. His colours, his
        proportions, his build, his height, his face, his kit and the drawing
        style all come from that image and from the SUBJECT above, and nothing
        below changes any of them.

        The other image is a POSE GUIDE: a stick-figure diagram on a plain white
        background, five figures in a row on one ground line, in the same
        left-to-right order as the FRAMES listed below. The Nth figure in the
        pose guide is the pose for the Nth frame. Take the GEOMETRY from it and
        only the geometry: where each foot is, which foot is on the ground line
        and which is lifted, how each knee is bent, the angle of each shoe, how
        far his body leans forward and how his back curves, how the shoulder
        line tilts, how high the dribbling hand is and how far ahead of him it
        reaches, where the swinging free hand is, and which way his head is
        turned. Where the words below and the pose guide describe the same
        thing, they agree; the pose guide is the exact version of it.

        THE COLOURS ON THE POSE GUIDE ONLY TELL THE LIMBS APART, so that where
        his legs cross you can see which is which. He runs toward the LEFT edge
        with his chest turned toward the viewer, so his dribbling side is the
        side FURTHER from the viewer: RED is the dribbling arm, reaching ahead
        of him on the far side of his body; ORANGE is the leg on that same far
        side; BLUE is the free arm, on the side NEARER the viewer; GREEN is the
        leg on that near side. None of these colours belongs in the drawing:
        his skin, his kit and his shoes keep exactly the colours of the
        character reference.

        THE HANDS ON THE POSE GUIDE: the FLAT hand with its fingers spread is
        the dribbling hand, palm to the floor, at exactly that height. The
        small closed square at the end of the blue arm is the free hand, a loose
        fist, swinging as he runs. The dribbling hand never pumps like a
        sprinter's: it stays out ahead of him, pushing the ball down.

        THE HEAD ON THE POSE GUIDE: the TRIANGLE on the face is his nose, and
        it points the way he is looking -- toward the LEFT edge, the way he is
        running. The curved line down the face bulges the same way, and the
        small oval on the other side of the head is the ear that shows. HE IS
        NOT LOOKING BACK OVER HIS SHOULDER AND NOT LOOKING AT THE VIEWER: he
        looks where he is going, the same way in all five frames. The short
        lines on top are his hair sticking out at rest.

        Draw the character from the reference running through those positions.
        The pose guide is an instruction, not artwork: its thin lines, its
        colours, its joint dots, its white background and its blank circular
        head are NOT part of the drawing and must not appear anywhere in it.
      # The frame table is no longer shared with run_dribble_r: that guide is
      # frozen by its approved take, and the two passing frames need changing.
      # Rick, on the first left batch: "in the second and fourth frame the
      # raised leg is still the same". It was -- because in the guide those two
      # frames had near-identical SILHOUETTES (knee up, shoe hanging behind,
      # planted foot under the body) and differed only in which limb was orange
      # and which green. Anything not reading the colour draws the same pose
      # twice. So they now differ in shape, as they really do in a three-quarter
      # view: a NEAR leg swinging through passes in front of the body and
      # projects large -- high knee, foot carried well forward; a FAR leg swings
      # behind the planted one and comes back foreshortened -- lower knee,
      # shorter reach, tucked closer to his centre line.
      frames:
        - {pose: calibration}
        - name: contact-dribble-side
          drop: 0.08
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: 0.025
          hip_tilt: 0.0
          hand: 0.36
          palm: 12
          free: [0.02, 0.52]
          free_shape: fist
          joints: {ank_d: [0.20, 0.09], ank_f: [-0.23, 0.20], knee_f: [-0.11, 0.26]}
          feet: {d: -5, f: 45}
        # The far leg is planted; the NEAR leg swings through in front of him.
        - name: passing-dribble-side
          drop: 0.10
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: -0.015
          hip_tilt: -0.015
          hand: 0.52
          free: [-0.12, 0.42]
          free_shape: fist
          joints: {ank_d: [0.02, 0.09], ank_f: [0.05, 0.27], knee_f: [0.12, 0.32]}
          feet: {d: 0, f: 40}
        - name: contact-free-side
          drop: 0.08
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: 0.025
          hip_tilt: 0.0
          hand: 0.36
          palm: 12
          free: [-0.20, 0.48]
          free_shape: fist
          joints: {ank_f: [0.08, 0.09], ank_d: [-0.11, 0.20], knee_d: [0.01, 0.26]}
          feet: {f: -5, d: 45}
        # The near leg is planted; the FAR leg swings behind it, foreshortened.
        - name: passing-free-side
          drop: 0.115
          lean: 0.10
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: -0.015
          hip_tilt: 0.015
          hand: 0.52
          free: [-0.12, 0.42]
          free_shape: fist
          joints: {ank_f: [-0.10, 0.09], ank_d: [-0.02, 0.19], knee_d: [0.07, 0.25]}
          feet: {f: 0, d: 22}
    kind: loop
    frames: 4
    ref: front
    travelling: true
    ground: |
      All frames share one ground line: the sole of the planted foot touches the
      same horizontal line in every frame.
    view: |
      three-quarter view, running toward the left of frame, chest turned
      slightly toward the viewer so the jersey number stays readable and reads
      forwards. HIS HEAD AND FACE ARE TURNED TOWARD THE LEFT EDGE OF THE
      PICTURE, the way he is running: his nose, his chin and his eyes all point
      that way, so his face is seen in three-quarter view from his left-front.
      He is not looking at the viewer and not looking back over his shoulder.
      {trail_right}
    critical: |
      CRITICAL: he is DRIBBLING A BASKETBALL WHILE HE RUNS — this is not a plain
      sprint. The hand on the VIEWER'S LEFT is the dribbling hand in frames
      {first} to {last}. It is always held out in front of his body with the
      palm facing DOWN toward the floor, fingers spread, pushing an invisible ball
      down. It is never a fist, never swung back, and never tucked in at his
      side. The OTHER arm does the running, swinging freely.
    # Worded to agree with the guide, exactly as run_dribble_r is.
    poses:
      - >-
          Dribbling hand pushed down to the hem of his shorts, palm flat to
          the floor. Legs: the leg on the dribbling side forward and planted,
          the other leg stretched out behind him, its toe pushing off. Free
          arm swung forward across his chest.
      - >-
          Dribbling hand risen to the waistband of his shorts, palm still
          down. Legs mid-stride: the far foot planted under his body, and the
          leg NEARER THE VIEWER swinging through IN FRONT of it — that near
          knee comes up high and its shin crosses in front of his standing
          leg, so the whole swinging leg is plainly visible. Torso leaning
          forward.
      - >-
          Dribbling hand pushed down to the hem of his shorts again, palm flat
          down. Legs: the other leg forward and planted, the leg on the
          dribbling side stretched out behind him, its toe pushing off. Free
          arm swung back behind him.
      - >-
          Dribbling hand risen to the waistband of his shorts, palm down. Legs
          mid-stride the other way, and it must NOT repeat the pose of the
          earlier mid-stride frame: this time the NEAR foot is planted under
          his body and the leg FURTHER FROM THE VIEWER swings through BEHIND
          it, half hidden by his standing leg and his shorts — that far knee
          lifts less, and less of that leg shows.
    ball: |
      The character is NOT holding a basketball in any frame — the ball is drawn
      separately by the game. His hand pushes down as if a ball were there.

  idle:
    title: Defensive stance, no ball
    # Standing without the ball: the shooter after his follow-through, and in
    # two-player the whole time the other player has it. Until now that was
    # dribble_idle's HIGHEST frame, hand out over nothing.
    #
    # Four frames, not two (Rick, 2026-09-25): every take that worked came off a
    # five-cell strip, and a two-frame loop only flicks. He shuffles his weight
    # in place -- set onto one leg, up through the middle, set onto the other,
    # up again -- with the feet as one drawing. The two UP frames are one pose.
    #
    # The hands are ASYMMETRIC -- one high to contest, one low for the passing
    # lane -- because that is a difference in silhouette, and silhouette is
    # what reaches the art (handover 04 §0(B)). Each arm is held fixed relative
    # to its own shoulder, so it is one drawing moved with the body. The
    # classic zombie reach, both arms straight out at the viewer, is the prior
    # to beat (§0(C)): the guide puts both elbows OUT to the side and the prose
    # says so.
    guide:
      file: art/guides/idle.png
      side: right              # the RAISED hand is on the viewer's right
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The COLOUR image of the character is the only authority on WHO HE IS.
        His colours, his proportions, his build, his height, his face, his kit
        and the drawing style all come from that image and from the SUBJECT
        above, and nothing below changes any of them.

        The other image is a POSE GUIDE: a plain black stick figure on a white
        background, five figures standing in a row on one ground line, in the
        same left-to-right order as the FRAMES listed below. The Nth figure in
        the pose guide is the pose for the Nth frame. Take the GEOMETRY from it
        and only the geometry: where each foot stands on the ground line, how
        deeply the knees are bent, how far the shoulder line tilts, how far his
        body leans to one side, and exactly where each elbow and each hand is.
        Where the words below and the pose guide describe the same thing, they
        agree; the pose guide is the exact version of it.

        THE HANDS ON THE POSE GUIDE are both OPEN, with the palm facing the
        viewer: the broad rectangle is the palm, the four lines off its end are
        the fingers spread apart, and the short line off its side is the thumb.
        The hand on the VIEWER'S RIGHT is raised beside his head, the wrist
        level with the top of it, fingers pointing up at the ceiling. The hand on the VIEWER'S LEFT is held low
        and wide, out beside his thigh, fingers pointing out and down. Each is
        ONE drawing, moved from frame to frame with his body.

        THE SHORT LINES ON THE POSE GUIDE'S HEAD are his hair sticking out at
        rest. Draw HIS OWN ragged hair that way. The lines are a direction, not
        hair.

        Draw the character from the colour reference standing in those
        positions. The pose guide is an instruction, not artwork: its thin flat
        lines, its joint dots, its white background, its blank circular head
        and its missing face are NOT part of the drawing and must not appear
        anywhere in it.
      frames:
        - {pose: calibration}
        - {name: set-left, drop: 0.13, tilt: -0.025, lean: -0.04, head: -4, stance: 0.27,
           hand: [0.17, 0.85], hand_shape: open,
           free: [-0.37, 0.395], free_shape: open,
           joints: {elb_d: [0.23, 0.715], elb_f: [-0.29, 0.505]}}
        - {name: up, drop: 0.095, stance: 0.27,
           hand: [0.21, 0.86], hand_shape: open,
           free: [-0.33, 0.455], free_shape: open,
           joints: {elb_d: [0.27, 0.725], elb_f: [-0.25, 0.565]}}
        - {name: set-right, drop: 0.13, tilt: 0.025, lean: 0.04, head: 4, stance: 0.27,
           hand: [0.25, 0.8], hand_shape: open,
           free: [-0.29, 0.445], free_shape: open,
           joints: {elb_d: [0.31, 0.665], elb_f: [-0.21, 0.555]}}
        - {name: up-again, drop: 0.095, stance: 0.27,
           hand: [0.21, 0.86], hand_shape: open,
           free: [-0.33, 0.455], free_shape: open,
           joints: {elb_d: [0.27, 0.725], elb_f: [-0.25, 0.565]}}
    kind: loop
    frames: 4
    ref: front
    view: |
      front view, facing the viewer, squared to camera, in a wide low defensive
      stance: knees bent, feet planted well wider than his shoulders, weight on
      the balls of his feet. He does NOT have the ball and is not dribbling.
    critical: |
      CRITICAL: this is a basketball DEFENDER'S stance, and the two hands do
      DIFFERENT jobs. They are held the same way in all four frames.

      THE HAND NEARER THE RIGHT EDGE OF THE PICTURE IS RAISED: elbow bent and
      pointing out to the side, level with his chest, forearm upright, and the
      hand held up beside his head, the wrist level with the top of his head
      and the fingers reaching above it, palm open and facing the viewer,
      fingers spread and pointing up at the ceiling.

      THE HAND NEARER THE LEFT EDGE OF THE PICTURE IS LOW AND WIDE: the arm
      reaches OUT SIDEWAYS and down, elbow slightly bent, and the hand is out
      beyond his hip at the height of his thigh, well clear of his leg, palm
      open and facing the viewer, fingers spread and pointing out and down.

      NEITHER ARM IS STRETCHED STRAIGHT OUT IN FRONT OF HIM toward the viewer,
      and neither is held at shoulder height reaching forward. Both elbows
      point OUT TO THE SIDES, so each whole arm shows against the background,
      clear of his body. Neither hand reaches down toward the floor — nothing
      about this pose suggests dribbling.

      HIS FEET ARE ONE DRAWING REPEATED IN ALL FOUR FRAMES: both shoes in the
      same place on the floor, the same wide distance apart, at the same angle.
      He moves by BENDING AND STRAIGHTENING HIS KNEES and shifting his weight
      from one leg to the other, never by moving his feet.

      HIS HEAD sits on top of his spine and his face stays turned to the
      viewer, alert, eyes on the viewer as if the viewer were the player he is
      guarding.
    poses:
      - >-
          SET LEFT, one of his two lowest frames: knees bent deepest, his weight
          shifted onto the leg nearer the LEFT EDGE of the picture, his hips and
          shoulders leaning a little toward that edge and the shoulder line
          tilted down on that side. Both hands exactly as described, moved with
          his body.
      - >-
          UP, weight back in the middle: knees straightened a little so he
          stands a touch taller, shoulders and hips level, still a wide low
          stance. Both hands exactly as described, a little higher with his
          body.
      - >-
          SET RIGHT, the mirror of SET LEFT in the body only: knees bent deepest,
          his weight shifted onto the leg nearer the RIGHT EDGE of the picture,
          his hips and shoulders leaning a little toward that edge and the
          shoulder line tilted down on that side. The hands do NOT swap: the
          raised hand is still the one nearer the right edge.
      - >-
          UP again, the same drawing as the first UP frame: weight back in the middle,
          shoulders and hips level, a touch taller.
    extra: |
      The difference between the frames is the whole animation: SET LEFT and
      SET RIGHT are clearly lower than the two UP frames, and lean opposite ways. His arms
      and hands keep one shape throughout, carried up, down and sideways with
      his body.
    ball: |
      The character is NOT holding a basketball in any frame and is NOT
      dribbling — the ball is drawn separately by the game and he does not have
      it.

  pickup:
    title: Pick the ball up off the floor
    # Face-on, one version for both directions, three frames of 0.1 s each
    # (PICKUP_TIME in index.html is 0.30 s). Rick, 2026-09-25, all defaults:
    #
    # AMPLITUDE FROM THE MONKEY (handover 07 §4 #25). His pickup, head top to
    # floor as a share of his dribbling height: 0.87, ~0.75, 0.99 -- a quick,
    # deep scoop between his feet and back up. The table below is that, on the
    # zombie's proportions: head top at about 0.75, 0.63 and 0.87 of standing.
    #
    # THE BALL FOLLOWS THE HANDS. The game used to start the dribble the moment
    # he reached the ball, so it bounced up at his side while his hands were
    # still at the floor. Now the ball rests on the floor between his feet for
    # frames 1-2 and sits between his hands in frame 3 (index.html, via the
    # manifest's pickupBall), and the first bounce starts after. So the hands
    # here are placed around WHERE THE GAME PUTS THE BALL: BALL_R is 13 of his
    # 132, a ball 0.20 of standing across.
    #
    # FRAME 3 IS TWO-HANDED AND CENTRED, not one hand coming up on the
    # dribbling side: what follows can be the stationary dribble (viewer's
    # left) or either run (right for run_dribble_r), so no one side is right.
    #
    # The forward bend is drawn with `joints`: the tool's `drop` lowers hips
    # and shoulders together (a squat), and a bend toward the camera is the
    # torso FORESHORTENING -- shoulders and head come down toward the hips.
    guide:
      file: art/guides/pickup.png
      side: left
      ears: true
      nose: true
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The COLOUR image of the character is the only authority on WHO HE IS.
        His colours, his proportions, his build, his height, his face, his kit
        and the drawing style all come from that image and from the SUBJECT
        above, and nothing below changes any of them. It does NOT decide which
        way he faces: in that drawing he is turned toward the right edge, and
        in this sheet he is not.

        The other image is a POSE GUIDE: a plain black stick figure on a white
        background, four figures standing in a row on one ground line, in the
        same left-to-right order as the FRAMES listed below. The Nth figure in
        the pose guide is the pose for the Nth frame. Take the GEOMETRY from it
        and only the geometry: where each foot stands on the ground line, how
        deeply the knees are bent, how far down his shoulders and head have
        come, and where BOTH hands are. Where the words below and the pose
        guide describe the same thing, they agree; the pose guide is the exact
        version of it.

        THE BODY ON THE POSE GUIDE is seen from the front while he bends
        forward TOWARD THE VIEWER. That is why, in the second and third
        figures, the shoulders sit so close above the hips: the chest is tipped
        toward the camera, not squashed. Draw a man bending forward at the
        waist and the knees, seen from the front.

        THE HANDS ON THE POSE GUIDE are the narrow shapes at the end of each
        arm. BOTH hands do the same thing in every frame, one on each side of
        his centre line, the same height as each other: this is a two-handed
        move.

        THE HEAD ON THE POSE GUIDE: the small TRIANGLE in the middle of the
        face is his nose, and the two small ovals on either side of the head
        are BOTH of his ears. His face points toward the viewer in every
        frame: nose in the middle of his face, both ears showing equally. The
        upright line down the face marks its centre and the level line his
        eyes. The short lines on top are his hair, at rest.

        Draw the character from the colour reference standing in those
        positions. The pose guide is an instruction, not artwork: its thin flat
        lines, its joint dots, its white background, its circular head, its
        triangle, its ovals and its face lines are NOT part of the drawing and
        must not appear anywhere in it.
      frames:
        - {pose: calibration}
        - name: reaching
          drop: 0.14
          stance: 0.27
          hand: [0.08, 0.21]
          hand_shape: hang
          free: [-0.08, 0.21]
          joints: {chest: [0, 0.56], sh_d: [0.13, 0.56], sh_f: [-0.13, 0.56],
                   head: [0, 0.68], elb_d: [0.126, 0.392], elb_f: [-0.126, 0.392]}
        - name: scooping
          drop: 0.22
          stance: 0.27
          hand: [0.115, 0.10]
          hand_shape: hang
          free: [-0.115, 0.10]
          joints: {chest: [0, 0.45], sh_d: [0.13, 0.45], sh_f: [-0.13, 0.45],
                   head: [0, 0.555], elb_d: [0.143, 0.282], elb_f: [-0.143, 0.282]}
        - name: gathered
          drop: 0.11
          stance: 0.27
          hand: [0.10, 0.47]
          hand_shape: hang
          free: [-0.10, 0.47]
          # elbows out and bent: the forearms point at the camera
          joints: {elb_d: [0.19, 0.53], elb_f: [-0.19, 0.53]}
    kind: one_shot
    frames: 3
    ref: front
    view: |
      front view, facing the viewer, squared to camera: his chest, his hips and
      his face all point out of the picture, both shoulders the same distance
      from the camera, the number on his jersey in the middle of his chest.
      In frames 2, 3 and 4 his feet are planted a little wider than his
      shoulders, and they stay exactly where they are: he bends, he does not
      step.
    critical: |
      CRITICAL: this is a TWO-HANDED move, and it is SYMMETRICAL. In every
      frame both hands are at the same height, one each side of his centre
      line, doing the same thing. Neither hand dribbles.

      THE BALL IS NOT DRAWN, but it is there: the game draws a basketball on
      the floor between his feet in frames 2 and 3, and between his hands in
      frame 4. His hands go where that ball is. In frames 3 and 4 there is a
      gap between his two hands exactly as wide as a basketball -- about the
      width of his own head -- and in that gap there is NOTHING: no ball, no
      shape, only empty background.
    poses:
      - >-
          REACHING: bending forward at the waist, knees bending, both arms
          reaching straight down toward the floor in front of his feet, hands
          open, at the height of his shins. Head tipped forward, eyes on the
          floor in front of him.
      - >-
          SCOOPING, the lowest point: knees deeply bent and chest tipped well
          forward over his thighs, both hands down at the floor between his
          feet with the palms facing each other, fingers curled, cupping the
          two sides of a ball-sized gap. Head down, looking at the floor
          between his hands.
      - >-
          GATHERED: back up in his low athletic crouch, head up, looking at
          the viewer. Both forearms forward, both hands in front of his
          waistband with the palms facing each other, a ball-sized gap
          between them, as if holding a basketball in front of his belly with
          both hands.
    ball: |
      The character is NOT holding a basketball in any frame, and none is
      drawn anywhere: the game draws the ball separately, in the gap between
      his hands.

  steal:
    title: Steal attempt
    kind: one_shot
    frames: 3
    ref: front
    # NEW. Plays on every steal press, successful or not, so it has to read as
    # an attempt rather than as taking possession. Deliberately a forward lunge
    # toward the viewer rather than a sideways one: the game steals in both
    # directions, and mirroring one sequence when the others are drawn per-side
    # is worse than not mirroring at all.
    view: |
      front view, facing the viewer, squared to camera, lunging forward toward
      the viewer.
    preamble: |
      He is stabbing a hand in to knock the ball away from an opponent in front
      of him. Fast, committed and slightly off-balance — this is a snatch, not a
      careful reach.
    poses:
      - >-
          The dip: dropping sharply into a deep crouch, weight thrown
          forward, both arms starting to sweep down and forward toward the
          floor in front of him, eyes fixed low, teeth gritted.
      - >-
          The swipe: fully extended in a low forward lunge, leading leg
          stretched out, the leading hand raked down and across in front
          of him at about knee height, palm open and fingers spread, the
          other arm flung back and wide for balance. {balance_low}
      - >-
          Recover: pulling back upright out of the lunge, weight coming
          back over the feet, both arms returning in toward the body,
          settling into a low athletic stance.
    extra: |
      The soles of both feet stay on the ground line throughout, including in
      the lunge.

  stolen:
    title: Ball stolen
    kind: one_shot
    frames: 3
    ref: front
    # The counterpart to `steal`, and the ONLY one-shot that must not end in the
    # dribbling stance -- the ball is gone, so it hands over to `idle` instead.
    # That is the clause most likely to come back wrong, so it is spelled out in
    # the closing rather than left to the shared default.
    #
    # Today the victim plays `turn` as a spin, which reads as a pirouette rather
    # than as losing the ball.
    #
    # It cancels on any input, like the idle breaks: losing the ball is already
    # the punishment, and locking the victim out of the chase would be a second
    # one. Three frames at 6 fps is half a second, inside the 0.9 s possession
    # immunity, so it never delays a counter-steal either.
    ground: |
      All frames share one ground line: the soles of the feet touch the same
      horizontal line in every frame. The feet stay planted throughout.
    view: |
      front view, facing the viewer, squared to camera, starting from the low
      athletic dribbling stance.
    preamble: |
      An opponent has just knocked the ball out of his hands. Frames {first} to
      {last} are one continuous reaction: half a beat of surprise, a flash of
      temper, then straight back into a defensive stance. {stolen_face}
    poses:
      - >-
          The instant it goes: still crouched low in the dribbling stance,
          the dribbling hand still out with the palm down over nothing at
          all, head snapped down toward where the ball was, eyes wide open
          and both brows up.
      - >-
          The flash of temper: snapping upright, both hands balled into
          fists at chest height with the elbows flared out, shoulders
          hunched up around the neck, head thrust forward, face contorted
          in fury.
      - >-
          Back to work: dropping into a WIDE low defensive stance, feet
          planted well wider than the shoulders, both hands coming up and
          out with the palms open and facing forward, head turned to track
          the opponent, still scowling.
    closing: |
      This is a one-shot, not a loop. Frame {first} must continue naturally from
      the low athletic dribbling stance. Frame {last} must settle into the WIDE
      defensive stance with both hands up and palms open — he no longer has the
      ball, so it must NOT return to the dribbling pose.
    extra: |
      The three frames must differ clearly in body level and in what the hands
      are doing: crouched with one hand down, upright with two fists, then wide
      with two open palms. He is not dribbling at any point after frame {first}.
    ball: |
      The character is NOT holding a basketball in any frame — the ball is drawn
      separately by the game, and in this sequence it has just been taken off
      him.

  # --- the shot ------------------------------------------------------------

  turn:
    title: Turn to shoot
    kind: one_shot
    frames: 2
    ref: front
    view: |
      the character turning on the spot, away from the viewer.
    poses:
      - >-
          Halfway through the turn: a three-quarter view from behind-ish,
          shoulders rotated away from the viewer, feet pivoting, head
          starting to lift and look up and away over the shoulder.
          {trail_turn}
      - >-
          Almost fully turned: back nearly square to the viewer, both
          hands coming up in front of the chest, knees bending into a
          shooting stance, head tilted up.
    closing: |
      This is a one-shot, not a loop. Frame {first} must continue naturally from
      a front view facing the viewer; frame {last} must settle into a back view
      squared away from the viewer.

  aim:
    title: Aim hold
    kind: loop
    frames: 2
    ref: back
    view: |
      back view, seen from directly behind, squared away from the viewer and
      looking up toward a basket high in front of him.
    poses:
      - >-
          Knees slightly bent, feet shoulder-width apart, both hands
          raised in front of the chest as if cradling something, head
          tilted up. {trail_relaxed}
      - >-
          The same pose settled very slightly lower: knees a touch more
          bent, hands a fraction lower, weight eased. A small breathing
          settle, nothing more — the two frames should be close.

  charge:
    title: Charge / wind-up
    kind: loop
    frames: 3
    ref: back
    ground: |
      All frames share one ground line: the soles of the feet touch the same
      horizontal line in every frame. The character's head height changes
      between frames only because he is crouching, not because the drawing has
      been rescaled.
    view: |
      back view, seen from directly behind, squared away from the viewer and
      looking up toward a basket high in front of him.
    preamble: |
      Frames {first} to {last} are one single motion, coiling deeper each frame.
    poses:
      - >-
          Upright: knees slightly bent, hands up at chest height, back
          straight. The beginning of the wind-up.
      - >-
          Crouching: knees clearly bent, hips dropped, hands drawn in
          closer to the chest, shoulders starting to hunch. {coil_mid}
      - >-
          Fully coiled: knees deeply bent, hips low, back compressed and
          rounded, hands tucked tight against the chest, every muscle
          loaded and about to spring. {coil_deep}
    closing: |
      Frames {first} to {last} are one continuous deepening crouch and will be
      played forwards and then backwards, so the motion must read smoothly in
      both directions.

  shot:
    title: The shot
    kind: one_shot
    frames: 4
    ref: back
    ground: |
      Frames {f1}, {f2} and {f4} share one ground line with the soles of the
      feet touching it; in frame {f3} he is up on his toes on that same line.
    view: |
      back view, seen from directly behind, squared away from the viewer and
      looking up toward a basket high in front of him.
    preamble: |
      Frames {first} to {last} are one continuous shooting motion.
    poses:
      - >-
          Fully coiled: knees deeply bent, hips low, back rounded, hands
          tucked tight against the chest.
      - >-
          Driving upward: legs extending, hips rising, both hands lifting
          past the head, elbows still bent. {trail_straighten}
      - >-
          Full extension: standing at full stretch up on the toes, both
          arms straight overhead, wrists snapped forward, fingers spread.
          This is the moment of release. {trail_balance}
      - >-
          Follow-through: still tall, arms still overhead but relaxing,
          wrists flopped loosely downward, weight settling back onto the
          heels. {trail_drop}
    closing: |
      This is a one-shot, not a loop. Frame {first} must continue naturally from
      a deep crouch, and frame {last} is the end of the motion.

  # --- chasing a loose ball ------------------------------------------------

  run_r:
    title: Run without the ball, moving right
    # Four frames, not the two the monkey has: a two-frame loop cannot change
    # which leg leads. The stride is run_dribble_l's (handover 04), reshaped the
    # same way -- the near leg swings through large IN FRONT, the far leg swings
    # BEHIND, foreshortened -- so the two passing frames differ in silhouette.
    # He runs a little higher (drop 0.05-0.065) and leans a little further
    # (0.12) than when dribbling. Both arms are sprinter's arms: bent near 90
    # degrees at the ends of the swing and opening to ~120 as the arms pass his
    # hips, fists, each swinging against its own leg. The elbows and wrists
    # were computed from the calibration limb lengths (upper arm 0.176, forearm
    # 0.190) with the sagittal swing foreshortened to 0.8 by the 50-degree
    # turn, and written in as numbers. x is toward the FAR side, which here is
    # forward; "hand"/"d" is the far arm, "free"/"f" the near one.
    # The two STRIDES are placed by hand, not by angle: batch 1 (b1r1-3) drew
    # them as one pose, because both had a fist out ahead of the chest. Now
    # they differ in silhouette -- far-leg stride: near arm ACROSS the chest,
    # far arm hidden behind him; near-leg stride: far arm reaching AHEAD,
    # near elbow jutting out behind his back.
    # Frozen once its take is approved: run_l has its own copy.
    guide:
      file: art/guides/run_r.png
      side: right
      colors: true
      ears: true
      nose: true
      note: |
        POSE GUIDE: TWO images are attached, and they do different jobs.

        The CHARACTER REFERENCE -- the finished pixel-art drawing of the
        character -- is the only authority on WHO HE IS. His colours, his
        proportions, his build, his height, his face, his kit and the drawing
        style all come from that image and from the SUBJECT above, and nothing
        below changes any of them.

        The other image is a POSE GUIDE: a stick-figure diagram on a plain white
        background, five figures in a row on one ground line, in the same
        left-to-right order as the FRAMES listed below. The Nth figure in the
        pose guide is the pose for the Nth frame. Take the GEOMETRY from it and
        only the geometry: where each foot is, which foot is on the ground line
        and which is lifted, how each knee is bent, the angle of each shoe, how
        far his body leans forward and how his back curves, how the shoulder
        line tilts, where each elbow and each fist is, and which way his head
        is turned. Where the words below and the pose guide describe the same
        thing, they agree; the pose guide is the exact version of it.

        THE COLOURS ON THE POSE GUIDE ONLY TELL THE LIMBS APART, so that where
        his legs cross you can see which is which. He runs toward the RIGHT
        edge with his chest turned toward the viewer: RED is the arm on the
        side FURTHER from the viewer and ORANGE is the leg on that same far
        side; BLUE is the arm on the side NEARER the viewer and GREEN is the
        leg on that near side. None of these colours belongs in the drawing:
        his skin, his kit and his shoes keep exactly the colours of the
        character reference.

        THE HANDS ON THE POSE GUIDE: the small closed square at the end of
        each arm is a loose FIST, and both hands are fists in every frame.
        Both arms are BENT AT THE ELBOW, close to a right angle, exactly as the
        guide draws them: a sprinter's arm swing, pumping forward and back
        beside his body. Neither arm is ever held straight out in front of him,
        and neither hand ever reaches down toward the floor. Where an arm
        crosses in front of his chest or passes behind his body in the guide,
        draw it that way: in the first stride the near arm covers part of his
        chest and the far arm cannot be seen.

        THE HEAD ON THE POSE GUIDE: the TRIANGLE on the face is his nose, and
        it points the way he is looking -- toward the RIGHT edge, the way he is
        running. The curved line down the face bulges the same way, and the
        small oval on the other side of the head is the ear that shows. HE IS
        NOT LOOKING BACK OVER HIS SHOULDER AND NOT LOOKING AT THE VIEWER: he
        looks where he is going, the same way in all five frames. The short
        lines on top are his hair sticking out at rest.

        Draw the character from the reference running through those positions.
        The pose guide is an instruction, not artwork: its thin lines, its
        colours, its joint dots, its white background and its blank circular
        head are NOT part of the drawing and must not appear anywhere in it.
      frames:
        - {pose: calibration}
        - name: stride-far-leg
          drop: 0.05
          lean: 0.12
          arch: 0.03
          turn: 50
          yaw: 55
          sh_tilt: 0.02
          hip_tilt: 0.0
          hand: [0.100, 0.490]
          hand_shape: fist
          free: [0.150, 0.680]
          free_shape: fist
          joints: {ank_d: [0.20, 0.09], ank_f: [-0.26, 0.22], knee_f: [-0.13, 0.28], elb_d: [0.100, 0.600], elb_f: [0.090, 0.600]}
