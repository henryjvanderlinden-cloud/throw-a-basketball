            free_shape: fist
            joints: {elb_d: [0.21, 0.60], elb_f: [-0.21, 0.60]}
          - name: crouching
            back: true
            drop: 0.12
            stance: 0.21
            hand: [0.08, 0.54]
            hand_shape: fist
            free: [-0.08, 0.54]
            free_shape: fist
            joints: {elb_d: [0.21, 0.51], elb_f: [-0.21, 0.51]}
          - &coiled
            name: coiled
            back: true
            drop: 0.22
            stance: 0.23
            hand: [0.07, 0.44]
            hand_shape: fist
            free: [-0.07, 0.44]
            free_shape: fist
            # hunched forward over the thighs: seen from behind, the back
            # tips toward the camera and the shoulders come down toward the hips
            joints: {chest: [0, 0.52], sh_d: [0.13, 0.52], sh_f: [-0.13, 0.52],
                     head: [0, 0.62], elb_d: [0.20, 0.41], elb_f: [-0.20, 0.41]}
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The character's head height changes
        between frames only because he is crouching, not because the drawing has
