    kind: loop
    frames: 4
    ref: front
    travelling: true
    ground: |
      All frames share one ground line: the sole of the planted foot touches the
      same horizontal line in every frame.
    view: |
      three-quarter view, sprinting toward the right of frame, chest turned
      slightly toward the viewer so the jersey number stays readable and reads
      forwards. HIS HEAD AND FACE ARE TURNED TOWARD THE RIGHT EDGE OF THE
      PICTURE, the way he is running: his nose, his chin and his eyes all point
      that way, so his face is seen in three-quarter view from his right-front.
      He is not looking at the viewer and not looking back over his shoulder.
      {trail_left}
    critical: |
      CRITICAL: he is SPRINTING WITHOUT THE BALL. BOTH hands are closed into
      loose FISTS and BOTH arms are BENT AT THE ELBOW, close to a right angle,
      pumping forward and back beside his body like a sprinter's, each arm
      swinging the opposite way to its leg. NEITHER ARM IS EVER HELD STRAIGHT
      OUT IN FRONT OF HIM -- he is not a zombie reaching forward with his arms
      out -- and neither hand reaches down toward the floor: he is not
      dribbling.
    poses:
      - >-
          Stride, far leg leading: the leg FURTHER FROM THE VIEWER forward and
          planted, the leg nearer the viewer stretched out behind him, its toe
          pushing off the floor, fully visible. The arm NEARER THE VIEWER swings
          forward ACROSS THE FRONT OF HIS CHEST, elbow bent, its fist in front
          of the number on his jersey and partly covering it. The far arm is
          swung back BEHIND HIS BODY and hidden by it: nothing sticks out behind
          his back in this frame. Leaning into the sprint.
      - >-
          Mid-stride: the far foot planted under his body, and the leg NEARER
          THE VIEWER swinging through IN FRONT of it -- that near knee comes up
          high and its shin crosses in front of his standing leg, so the whole
          swinging leg is plainly visible. Both arms swinging past his sides,
          elbows still bent, fists at waist height.
      - >-
          Stride, near leg leading: the leg NEARER THE VIEWER forward and
          planted, the far leg stretched out behind him, its toe pushing off.
          The far arm driven forward, reaching out AHEAD of his chest, its fist
          at chest height in front of him and well clear of his body; the arm
          nearer the viewer swung back, its bent elbow jutting out BEHIND HIS
          BACK and its fist beside his hip. The number on his jersey is fully
          visible. Leaning into the sprint. This stride must NOT repeat the
          earlier one: there, one arm crossed his chest and nothing showed
          behind him; here, one arm reaches out ahead and the other juts out
          behind.
      - >-
          Mid-stride the other way, and it must NOT repeat the pose of the
          earlier mid-stride: this time the NEAR foot is planted under his body
          and the leg FURTHER FROM THE VIEWER swings through BEHIND it, half
          hidden by his standing leg and his shorts -- that far knee lifts less,
          and less of that leg shows. Both arms swinging past his sides again,
          elbows bent, fists at waist height.
    extra: |
      He is running flat out and is not dribbling -- neither hand reaches toward
      the floor.

