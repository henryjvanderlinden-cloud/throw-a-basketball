<title>Hoop Shooter</title>
<style>
  :root{
    --bg:#f4efe6; --ink:#20232b; --muted:#6c7280; --line:#d8d0c2;
    --wood:#e3b579; --wood2:#d3a165; --panel:#ffffff; --accent:#e2572b;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161b; --ink:#eceff5; --muted:#98a0b0; --line:#2b3038;
      --wood:#7a5533; --wood2:#6a4829; --panel:#1d2027; --accent:#ff7a4d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161b; --ink:#eceff5; --muted:#98a0b0; --line:#2b3038;
    --wood:#7a5533; --wood2:#6a4829; --panel:#1d2027; --accent:#ff7a4d;
  }
  body{background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px;min-height:100vh;box-sizing:border-box}
  #stagewrap{width:100%;max-width:980px}
  svg#stage{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px;background:var(--panel);
            touch-action:none;user-select:none}
  .legend{color:var(--muted);font-size:12.5px;text-align:center;max-width:820px}
  kbd{font:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--bg);color:var(--ink)}
</style>

<div id="stagewrap">
<svg id="stage" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" aria-label="Basketball game">
  <defs>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="var(--wood)"/><stop offset="1" stop-color="var(--wood2)"/>
    </linearGradient>
    <radialGradient id="ballGrad" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff9f56"/><stop offset="1" stop-color="#d8541c"/>
    </radialGradient>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="13"/></clipPath>
  </defs>

  <!-- ===== static scene ===== -->
  <g id="scene">
    <!-- painted court backdrop; sized so the artwork's own rim lands on the play rim -->
    <image id="court" x="0" y="0" width="960" height="720"
           preserveAspectRatio="xMidYMin slice" opacity="0" href=""/>
    <rect id="scrim" x="0" y="0" width="960" height="640" fill="#0b0d12" opacity="0"/>
    <!-- vector court (shown when no artwork is loaded) -->
    <g id="vectorScene">
      <rect x="0" y="596" width="960" height="44" fill="url(#floorGrad)"/>
      <line x1="0" y1="596" x2="960" y2="596" stroke="var(--line)" stroke-width="2"/>
    </g>
    <!-- ceiling beam (the ball bounces off this) -->
    <rect id="ceiling" x="0" y="0" width="960" height="10" fill="var(--line)"/>
    <!-- floor contact line, kept subtle over artwork -->
    <line id="floorLine" x1="0" y1="596" x2="960" y2="596" stroke="#000" stroke-width="2" opacity="0"/>
  </g>

  <!-- ground shadows -->
  <ellipse id="shPlayer" cx="0" cy="596" rx="26" ry="6" fill="#000" opacity="0.22"/>
  <ellipse id="shBall" cx="0" cy="596" rx="12" ry="4" fill="#000" opacity="0.18"/>

  <!-- ===== hoop rig (top middle) ===== -->
  <g id="hoop">
    <!-- support -->
    <rect x="474" y="10" width="12" height="34" fill="var(--muted)"/>
    <rect x="384" y="40" width="192" height="9" fill="var(--muted)"/>
    <!-- backboards (left / right wings) -->
    <rect id="bbL" x="390" y="49" width="12" height="96" fill="#c9d4e2" stroke="var(--ink)" stroke-width="2"/>
    <rect id="bbR" x="558" y="49" width="12" height="96" fill="#c9d4e2" stroke="var(--ink)" stroke-width="2"/>
    <!-- inner target squares -->
    <rect x="402" y="96" width="4" height="34" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <rect x="554" y="96" width="4" height="34" fill="none" stroke="var(--accent)" stroke-width="3"/>
    <!-- brackets tying the rim to the boards -->
    <path d="M396,145 L422,166 M564,145 L538,166" stroke="var(--muted)" stroke-width="4" fill="none"/>
    <!-- net -->
    <g id="net" stroke="var(--muted)" stroke-width="1.6" fill="none" opacity="0.85"></g>
    <!-- rim -->
    <line x1="422" y1="166" x2="538" y2="166" stroke="#e2572b" stroke-width="5" stroke-linecap="round"/>
    <circle cx="422" cy="166" r="6" fill="#e2572b"/>
    <circle cx="538" cy="166" r="6" fill="#e2572b"/>
  </g>

  <!-- ===== aim line (white underlay keeps it readable on dark artwork) ===== -->
  <g id="aimg" opacity="0" pointer-events="none">
    <line id="aimlineBg" x1="0" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="8"
          stroke-dasharray="5 10" stroke-linecap="round" opacity="0.75"/>
    <line id="aimline" x1="0" y1="0" x2="0" y2="0" stroke="#20232b" stroke-width="3"
          stroke-dasharray="5 10" stroke-linecap="round"/>
  </g>

  <!-- ===== player ===== -->
  <!-- Sprite frames are injected into #psprite by the game; #pvector is the
       fallback figure used when sprites/ is not available. -->
  <g id="player">
   <g id="pflip">
    <g id="psprite"></g>
    <g id="pvector">
      <!-- white sticker outline so the figure reads on any court -->
      <g stroke="#ffffff" stroke-linecap="round" fill="#ffffff" opacity="0.85">
        <line x1="-8" y1="-26" x2="-11" y2="0" stroke-width="13"/>
        <line x1="6"  y1="-26" x2="10" y2="0" stroke-width="13"/>
        <line id="armBbg" x1="-10" y1="-52" x2="-22" y2="-34" stroke-width="12"/>
        <line id="armFbg" x1="10" y1="-52" x2="24" y2="-36" stroke-width="12"/>
        <rect x="-16" y="-62" width="33" height="42" rx="11"/>
        <circle cx="1" cy="-70" r="17"/>
      </g>
      <!-- legs -->
      <line x1="-8" y1="-26" x2="-11" y2="0" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <line x1="6"  y1="-26" x2="10" y2="0" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/>
      <!-- body -->
      <rect x="-12" y="-58" width="25" height="34" rx="8" fill="var(--accent)"/>
      <!-- arms -->
      <line id="armB" x1="-10" y1="-52" x2="-22" y2="-34" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <line id="armF" x1="10" y1="-52" x2="24" y2="-36" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
      <!-- head -->
      <circle cx="1" cy="-70" r="13" fill="#f0c9a4" stroke="var(--ink)" stroke-width="2"/>
      <path d="M-12,-76 a13,13 0 0 1 26,0 z" fill="var(--ink)"/>
    </g>
   </g>
  </g>

  <!-- ===== ball (swap circle for <image> sprite later) ===== -->
  <g id="ballg">
    <circle r="13" fill="url(#ballGrad)" stroke="#7d2f0d" stroke-width="1.5"/>
    <g clip-path="url(#ballClip)" stroke="#7d2f0d" stroke-width="1.6" fill="none">
      <line x1="-13" y1="0" x2="13" y2="0"/>
      <line x1="0" y1="-13" x2="0" y2="13"/>
      <path d="M-9,-13 q6,13 0,26"/>
      <path d="M9,-13 q-6,13 0,26"/>
    </g>
  </g>

  <!-- ===== power meter ===== -->
  <g id="power" opacity="0">
    <rect id="pwBg" x="0" y="0" width="16" height="96" rx="8" fill="var(--line)"/>
    <rect id="pwFill" x="0" y="0" width="16" height="0" rx="8" fill="#3fbf5f"/>
  </g>

  <!-- ===== HUD ===== -->
  <g id="hud" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect x="620" y="20" width="320" height="56" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
    <text x="648" y="43" font-size="11" fill="var(--muted)" letter-spacing="1.5">MADE</text>
    <text id="hudMade" x="648" y="66" font-size="22" font-weight="700" fill="var(--ink)">0</text>
    <text x="716" y="43" font-size="11" fill="var(--muted)" letter-spacing="1.5">POINTS</text>
    <text id="hudPts" x="716" y="66" font-size="22" font-weight="700" fill="var(--ink)">0</text>
    <text x="828" y="43" font-size="11" fill="var(--muted)" letter-spacing="1.5">SHOT CLOCK</text>
    <text id="hudClock" x="828" y="66" font-size="22" font-weight="700" fill="var(--ink)">10.0</text>
  </g>

  <!-- court name toast -->
  <g id="toast" opacity="0">
    <rect x="20" y="20" width="150" height="30" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
    <text id="toastText" x="95" y="40" text-anchor="middle" font-size="13" fill="var(--ink)"
          font-family="ui-sans-serif,system-ui">Court: Vector</text>
  </g>

  <!-- ===== character select ===== -->
  <g id="select" opacity="0" pointer-events="none">
    <rect x="0" y="0" width="960" height="640" fill="#0b0d12" opacity="0.82"/>
    <text x="480" y="96" text-anchor="middle" font-size="34" font-weight="800" fill="#fff"
          font-family="ui-sans-serif,system-ui" letter-spacing="1">CHOOSE YOUR BALLER</text>
    <g id="selCards"></g>
    <text x="480" y="592" text-anchor="middle" font-size="15" fill="#aab2c0"
          font-family="ui-sans-serif,system-ui">← → to pick · Space to play</text>
  </g>

  <!-- ===== overlay ===== -->
  <g id="overlay" opacity="0" pointer-events="none">
    <rect x="0" y="0" width="960" height="640" fill="#000" opacity="0.62"/>
    <text id="ovTitle" x="480" y="286" text-anchor="middle" font-size="52" font-weight="800" fill="#fff"
          font-family="ui-sans-serif,system-ui">TIME'S UP</text>
    <text id="ovScore" x="480" y="338" text-anchor="middle" font-size="24" fill="#e6e9f0"
          font-family="ui-monospace,monospace">0 points</text>
    <text x="480" y="392" text-anchor="middle" font-size="17" fill="#aab2c0"
          font-family="ui-sans-serif,system-ui">Press Space or R to play again</text>
  </g>
</svg>
</div>

<p class="legend">
  <kbd>←</kbd> <kbd>→</kbd> move &amp; dribble · <kbd>Space</kbd> pick up the ball and aim ·
  <kbd>←</kbd> <kbd>→</kbd> set the angle · hold <kbd>Space</kbd> to charge (green → red), release to shoot ·
  <kbd>R</kbd> restart (and pick a new character) · <kbd>C</kbd> or <kbd>1</kbd>–<kbd>4</kbd> switch court.
  The shot clock starts on your first <kbd>Space</kbd> and resets on every throw — let it hit zero and the game is over.
</p>

<!-- Generated sprite data. Absent -> the game falls back to the vector figure. -->
<script src="sprites/manifest.js"></script>

<script>
(() => {
'use strict';

// ---------------------------------------------------------------- constants
const W = 960, H = 640, GROUND = 596;
const G = 1500;                 // gravity px/s^2
const BALL_R = 13;
const AIR = 0.13;               // linear air drag coefficient
const REST_FLOOR = 0.66, REST_WALL = 0.72, REST_RIM = 0.62, REST_BOARD = 0.68;
const FRICTION = 0.86;          // tangential damping on rim/board hits

const HOOP = { cx: 480, rimY: 166, halfW: 58, nubR: 6 };
const BOARDS = [
  { x: 390, y: 49, w: 12, h: 96 },   // left wing
  { x: 558, y: 49, w: 12, h: 96 }    // right wing
];
const BEAM = { x: 384, y: 40, w: 192, h: 9 };

const PLAYER_SPEED = 330;
const PLAYER_MIN_X = 40, PLAYER_MAX_X = W - 40;
const HAND_DY = -92;            // hand offset from feet (ball held above the head)
const HAND_DX = 20;
const CHARGE_RATE = 1 / 1.05;   // full power in ~1.05 s
const AIM_RATE = 62;            // degrees per second
const AIM_MIN = 18, AIM_MAX = 162;
const SPEED_MIN = 760, SPEED_MAX = 1560;
const PICKUP_DIST = 62;
// Height of the dribbling hand, as a fraction of the character's height. The
// four characters measure 0.40-0.45; one constant is steadier than per-sprite
// detection, which trips over things like the monkey's tail.
const DRIBBLE_HAND_H = 0.42;
const PICKUP_LOCKOUT = 0.35;    // s after release before you can re-catch

const CLOCK_BASE = 10, CLOCK_FLOOR = 3, CLOCK_STEP = 0.5, PTS_PER_STEP = 12;
const POINTS_PER_BASKET = 3;

// ---------------------------------------------------------------- elements
const $ = id => document.getElementById(id);
const el = {
  player: $('player'), pflip: $('pflip'), armF: $('armF'), armB: $('armB'),
  ballg: $('ballg'), aim: $('aimline'),
  power: $('power'), pwBg: $('pwBg'), pwFill: $('pwFill'),
  made: $('hudMade'), pts: $('hudPts'), clock: $('hudClock'),
  overlay: $('overlay'), ovTitle: $('ovTitle'), ovScore: $('ovScore'),
  net: $('net'),
  aimg: $('aimg'), aimBg: $('aimlineBg'), armFbg: $('armFbg'), armBbg: $('armBbg'),
  psprite: $('psprite'), pvector: $('pvector'),
  select: $('select'), selCards: $('selCards'), hud: $('hud'),
  court: $('court'), scrim: $('scrim'), vectorScene: $('vectorScene'),
  ceiling: $('ceiling'), floorLine: $('floorLine'),
  shPlayer: $('shPlayer'), shBall: $('shBall'),
  bbL: $('bbL'), bbR: $('bbR'),
  toast: $('toast'), toastText: $('toastText')
};

// ---------------------------------------------------------------- courts
// Backdrops live next to this file. The artwork is framed so its painted rim
// lands on the play rim when the image is drawn 960x720, top-aligned.
const COURT_DIR = 'artwork/basketball-courts/';
const COURTS = [
  { id: 'vector',   label: 'Vector',   src: null },
  { id: 'nba',      label: 'NBA',      src: COURT_DIR + 'nba.png' },
  { id: 'school',   label: 'School',   src: COURT_DIR + 'school.png' },
  { id: 'graffiti', label: 'Graffiti', src: COURT_DIR + 'graffiti.png' }
];
let courtIdx = 0, toastT = 0;

function applyCourt(i, announce) {
  courtIdx = ((i % COURTS.length) + COURTS.length) % COURTS.length;
  const c = COURTS[courtIdx];
  if (c.src) {
    el.court.setAttribute('href', c.src);
    el.court.setAttribute('opacity', '1');
    el.scrim.setAttribute('opacity', '0.12');
    el.vectorScene.setAttribute('opacity', '0');
    el.ceiling.setAttribute('opacity', '0.25');
    el.floorLine.setAttribute('opacity', '0.35');
    el.bbL.setAttribute('opacity', '0.5'); el.bbR.setAttribute('opacity', '0.5');
  } else {
    el.court.setAttribute('opacity', '0');
    el.scrim.setAttribute('opacity', '0');
    el.vectorScene.setAttribute('opacity', '1');
    el.ceiling.setAttribute('opacity', '1');
    el.floorLine.setAttribute('opacity', '0');
    el.bbL.setAttribute('opacity', '1'); el.bbR.setAttribute('opacity', '1');
  }
  try { localStorage.setItem('hoop.court', c.id); } catch (e) {}
  if (announce) { el.toastText.textContent = 'Court: ' + c.label; toastT = 1.6; }
}
// artwork missing (e.g. opened without the repo folder) -> fall back to vector
el.court.addEventListener('error', () => { if (courtIdx !== 0) applyCourt(0, false); });
(() => {
  let saved = null;
  try { saved = localStorage.getItem('hoop.court'); } catch (e) {}
  const i = Math.max(0, COURTS.findIndex(c => c.id === saved));
  applyCourt(i >= 0 ? i : 0, false);
})();

// net strings (static)
(() => {
  let d = '';
  const L = HOOP.cx - HOOP.halfW, R = HOOP.cx + HOOP.halfW, top = HOOP.rimY, bot = HOOP.rimY + 40;
  const n = 7;
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = L + (R - L) * t;
    const xb = HOOP.cx + (x - HOOP.cx) * 0.55;
    d += `M${x.toFixed(1)},${top} L${xb.toFixed(1)},${bot} `;
  }
  for (let k = 1; k <= 2; k++) {
    const y = top + (bot - top) * (k / 3), s = 1 - 0.45 * (k / 3);
    let pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = L + (R - L) * t;
      pts.push(`${(HOOP.cx + (x - HOOP.cx) * s).toFixed(1)},${y.toFixed(1)}`);
    }
    d += 'M' + pts.join(' L') + ' ';
  }
  el.net.innerHTML = `<path d="${d}"/>`;
})();

// ---------------------------------------------------------------- characters
// sprites/manifest.js defines window.SPRITE_MANIFEST. Without it the game runs
// on the vector figure and skips the character picker.
const SVGNS = 'http://www.w3.org/2000/svg';
const CHARS = (window.SPRITE_MANIFEST && Array.isArray(window.SPRITE_MANIFEST.characters))
  ? window.SPRITE_MANIFEST.characters : [];
const HAS_SPRITES = CHARS.length > 0;

// Frames per second for the sequences that run on a clock. Dribbling is the
// exception -- it is driven by the ball's own bounce. RUN covers chasing a
// loose ball, where there is no bounce to follow.
const ANIM_HZ = { aim: 2.6, run: 7, gameover: 2.5 };
const RISE_HOLD = 0.05;         // the shot's rising frame, if the art has one
const RELEASE_HOLD = 0.27;      // ...then the release
const FOLLOW_HOLD = 0.5;        // ...then the follow-through
const TURN_TIME = 0.36;         // front stance -> back stance
const PICKUP_TIME = 0.30;       // gathering the ball off the floor
// Celebrations vary in length, so their duration comes from the frame count
// rather than a fixed timer. The handspring plays faster -- a six-frame tumble
// at the others' pace would be slow motion -- and rarely, because a backflip on
// every basket stops being a treat.
const CELEB_HZ = { celebrate_flip: 8 };
const CELEB_HZ_DEFAULT = 2.5;
const CELEB_RARE = { celebrate_flip: 0.12 };   // roughly one basket in eight
const CELEBRATE_TIME = 1.3;     // the vector fallback, which has no sequences
// With a 10s shot clock there is never a long quiet stretch, so breaks come
// early and often; the clock floor is what stops them being a liability.
const BREAK_MIN = 2, BREAK_MAX = 4;
const BREAK_CLOCK_FLOOR = 4;    // never mug for the crowd under this much time
const PANIC_CLOCK = 2;          // ...and start panicking about it under this

let charIdx = 0, curChar = null;
let frameEls = {};              // sequence name -> [<image>]
let shown = null;               // [sequence, index] currently visible

function buildCharacter(i) {
  curChar = CHARS[i] || null;
  el.psprite.textContent = '';
  frameEls = {}; shown = null;
  el.pvector.setAttribute('opacity', curChar ? '0' : '1');
  if (!curChar) return;
  for (const [name, frames] of Object.entries(curChar.sequences)) {
    frameEls[name] = frames.map(f => {
      const im = document.createElementNS(SVGNS, 'image');
      im.setAttribute('href', f.src);
      im.setAttribute('width', f.w); im.setAttribute('height', f.h);
      im.setAttribute('x', -f.footX); im.setAttribute('y', -f.footY);
      im.setAttribute('opacity', '0');
      el.psprite.appendChild(im);
      return im;
    });
  }
  try { localStorage.setItem('hoop.char', curChar.key); } catch (e) {}
}

const seqOf = name => (curChar && curChar.sequences[name]) || null;
// Fall back to the first sequence in the list that the character actually has.
const firstSeq = (...names) => names.find(n => seqOf(n)) || 'dribble_idle';

function showFrame(name, idx) {
  const list = frameEls[name];
  if (!list || !list.length) return;
  idx = Math.max(0, Math.min(list.length - 1, idx));
  if (shown && shown[0] === name && shown[1] === idx) return;
  if (shown && frameEls[shown[0]]) frameEls[shown[0]][shown[1]].setAttribute('opacity', '0');
  list[idx].setAttribute('opacity', '1');
  shown = [name, idx];
}

// Choose which celebration to play, and say how long it runs.
function pickCelebration() {
  const names = Object.keys(curChar ? curChar.sequences : {}).filter(n => n.startsWith('celebrate'));
  if (!names.length) return [null, CELEBRATE_TIME];
  const common = names.filter(n => !CELEB_RARE[n]);
  let name;
  const rare = names.find(n => CELEB_RARE[n] && Math.random() < CELEB_RARE[n]);
  if (rare && common.length) name = rare;
  else name = (common.length ? common : names)[Math.floor(Math.random() * (common.length || names.length))];
  return [name, seqOf(name).length / (CELEB_HZ[name] || CELEB_HZ_DEFAULT)];
}

// A character drawn per direction is never mirrored, so nothing it carries
// flips with facing either.
const flipsWithFacing = () => !curChar || curChar.mirror;

// Which way the dribbling hand points in a given sequence: +1 is the viewer's
// right. Mirrored characters have only one set of art, so theirs follows facing.
function ballSide(seq) {
  if (flipsWithFacing()) return g.facing;
  return (curChar.ballSide && curChar.ballSide[seq]) || 1;
}

// The sequence the dribble is playing right now -- needed in step() to put the
// ball on the correct side, and in animatePlayer() to draw it.
function dribbleSeq() {
  if (!curChar) return 'dribble_idle';
  if (keys.ArrowLeft || keys.ArrowRight) {
    return firstSeq(g.facing >= 0 ? 'run_dribble_r' : 'run_dribble_l', 'dribble_idle');
  }
  // Down to the last seconds he stops clowning and starts pointing at the clock.
  if (g.clockOn && g.clock <= PANIC_CLOCK && seqOf('panic')) return 'panic';
  return (g.breakSeq && seqOf(g.breakSeq)) ? g.breakSeq : 'dribble_idle';
}

// where the ball sits when the character is holding it
function holdPos() {
  const hx = curChar ? curChar.handX : HAND_DX;
  const hy = curChar ? curChar.handY + 12 : HAND_DY - 14;
  return [g.px + hx * (flipsWithFacing() ? g.facing : 1), GROUND + hy];
}

function buildSelectCards() {
  el.selCards.textContent = '';
  const n = CHARS.length, cw = 200, gap = 24;
  const x0 = (W - (n * cw + (n - 1) * gap)) / 2;
  CHARS.forEach((c, i) => {
    const x = x0 + i * (cw + gap), y = 140, ch = 400;
    const grp = document.createElementNS(SVGNS, 'g');
    grp.setAttribute('data-i', String(i));
    grp.style.cursor = 'pointer';

    const card = document.createElementNS(SVGNS, 'rect');
    card.setAttribute('x', x); card.setAttribute('y', y);
    card.setAttribute('width', cw); card.setAttribute('height', ch);
    card.setAttribute('rx', 16); card.setAttribute('fill', '#ffffff');
    card.setAttribute('fill-opacity', '0.07');
    card.setAttribute('stroke', '#ffffff'); card.setAttribute('stroke-opacity', '0.25');
    card.setAttribute('stroke-width', '3');
    grp.appendChild(card);

    const f = c.sequences.dribble_idle[0], k = 250 / f.h;
    const im = document.createElementNS(SVGNS, 'image');
    im.setAttribute('href', f.src);
    im.setAttribute('width', f.w * k); im.setAttribute('height', f.h * k);
    im.setAttribute('x', x + cw / 2 - f.footX * k);
    im.setAttribute('y', y + ch - 74 - f.footY * k);
    grp.appendChild(im);

    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', x + cw / 2); t.setAttribute('y', y + ch - 32);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '19');
    t.setAttribute('font-weight', '700'); t.setAttribute('fill', '#fff');
    t.setAttribute('font-family', 'ui-sans-serif,system-ui');
    t.textContent = c.label;
    grp.appendChild(t);

    grp.addEventListener('click', () => {
      if (g.state !== STATE.SELECT) return;
      charIdx = i; paintSelection(); startRun();
    });
    el.selCards.appendChild(grp);
  });
}

function paintSelection() {
  [...el.selCards.children].forEach((grp, i) => {
    const on = i === charIdx, card = grp.firstChild;
    card.setAttribute('fill-opacity', on ? '0.18' : '0.07');
    card.setAttribute('stroke', on ? '#ffb347' : '#ffffff');
    card.setAttribute('stroke-opacity', on ? '1' : '0.25');
    card.setAttribute('stroke-width', on ? '5' : '3');
  });
}

// ---------------------------------------------------------------- state
const STATE = { SELECT: 'SELECT', DRIBBLE: 'DRIBBLE', AIM: 'AIM', CHARGE: 'CHARGE', LIVE: 'LIVE', OVER: 'OVER' };
let g;

function reset() {
  g = {
    state: HAS_SPRITES ? STATE.SELECT : STATE.DRIBBLE,
    px: W * 0.5 - 170,          // player feet x
    facing: 1,
    dribT: 0,
    angle: 74,                  // degrees, CCW from +x
    power: 0,
    spaceHeld: false,
    ball: { x: 0, y: 0, vx: 0, vy: 0, r: BALL_R, spin: 0, rest: false },
    held: true,
    lockout: 0,
    scoredThisShot: false,
    made: 0, points: 0,
    clockOn: false,
    clockLimit: CLOCK_BASE,
    clock: CLOCK_BASE,
    flash: 0,
    animT: 0,
    throwT: 99,                 // time since the release, for the throw poses
    turnT: 0,                   // one-shots, counting down
    pickupT: 0,
    celebT: 0,
    celebSeq: null,             // which celebration this basket earned
    breakSeq: null,             // the idle break currently playing, if any
    breakT: 0,
    breakAt: BREAK_MIN + Math.random() * (BREAK_MAX - BREAK_MIN),
    stillT: 0                   // how long he has stood dribbling on the spot
  };
  el.overlay.setAttribute('opacity', '0');
  el.select.setAttribute('opacity', g.state === STATE.SELECT ? '1' : '0');
  el.select.setAttribute('pointer-events', g.state === STATE.SELECT ? 'auto' : 'none');
}

function startRun() {
  buildCharacter(charIdx);
  g.state = STATE.DRIBBLE;
  el.select.setAttribute('opacity', '0');
  el.select.setAttribute('pointer-events', 'none');
}

if (HAS_SPRITES) {
  let saved = null;
  try { saved = localStorage.getItem('hoop.char'); } catch (e) {}
  const i = CHARS.findIndex(c => c.key === saved);
  charIdx = i >= 0 ? i : 0;
}
reset();
if (HAS_SPRITES) { buildSelectCards(); paintSelection(); buildCharacter(charIdx); }

function clockLimitFor(points) {
  return Math.max(CLOCK_FLOOR, CLOCK_BASE - CLOCK_STEP * Math.floor(points / PTS_PER_STEP));
}
// how tall the current character is, for shadow and pickup sizing
const bodyH = () => curChar ? curChar.sequences.dribble_idle[0].h : 70;

// ---------------------------------------------------------------- input
const keys = Object.create(null);
window.addEventListener('keydown', e => {
  const k = e.code;
  if (['ArrowLeft', 'ArrowRight', 'Space', 'ArrowUp', 'ArrowDown'].includes(k)) e.preventDefault();
  if (k === 'KeyR') { reset(); return; }
  if (k === 'KeyC') { applyCourt(courtIdx + 1, true); return; }
  if (k.startsWith('Digit')) {
    const n = +k.slice(5);
    if (n >= 1 && n <= COURTS.length) { applyCourt(n - 1, true); return; }
  }
  if (e.repeat) return;
  keys[k] = true;
  if (g.state === STATE.SELECT) {
    if (k === 'ArrowLeft')  { charIdx = (charIdx - 1 + CHARS.length) % CHARS.length; paintSelection(); return; }
    if (k === 'ArrowRight') { charIdx = (charIdx + 1) % CHARS.length; paintSelection(); return; }
    if (k === 'Enter') { startRun(); return; }
  }
  if (k === 'Space') onSpaceDown();
});
window.addEventListener('keyup', e => {
  const k = e.code;
  keys[k] = false;
  if (k === 'Space') onSpaceUp();
});
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function onSpaceDown() {
  if (g.state === STATE.SELECT) { startRun(); return; }
  if (g.state === STATE.OVER) { reset(); return; }
  if (!g.clockOn) { g.clockOn = true; g.clock = g.clockLimit; }
  if (g.state === STATE.DRIBBLE) {
    g.state = STATE.AIM;                 // grab the ball, start aiming
    g.held = true;
    g.turnT = TURN_TIME;                 // pivot from the front stance
    g.breakSeq = null; g.breakT = 0;     // a break never costs you control
  } else if (g.state === STATE.AIM) {
    g.state = STATE.CHARGE;              // second press: start charging
    g.power = 0;
  }
}
function onSpaceUp() {
  if (g.state === STATE.CHARGE) shoot();
}

function shoot() {
  const rad = g.angle * Math.PI / 180;
  const speed = SPEED_MIN + (SPEED_MAX - SPEED_MIN) * g.power;
  const b = g.ball;
  [b.x, b.y] = holdPos();
  b.vx = Math.cos(rad) * speed;
  b.vy = -Math.sin(rad) * speed;
  b.rest = false;
  g.held = false;
  g.lockout = PICKUP_LOCKOUT;
  g.scoredThisShot = false;
  g.state = STATE.LIVE;
  g.power = 0;
  g.throwT = 0;
  g.clock = g.clockLimit;   // every throw resets the shot clock
}

// ---------------------------------------------------------------- collisions
function collideRect(b, r, rest) {
  const cx = Math.max(r.x, Math.min(b.x, r.x + r.w));
  const cy = Math.max(r.y, Math.min(b.y, r.y + r.h));
  let dx = b.x - cx, dy = b.y - cy;
  let d = Math.hypot(dx, dy);
  let nx, ny;
  if (d > b.r) return false;
  if (d < 1e-6) {                                    // centre inside the rect
    const left = b.x - r.x, right = r.x + r.w - b.x, top = b.y - r.y, bot = r.y + r.h - b.y;
    const m = Math.min(left, right, top, bot);
    if (m === left) { nx = -1; ny = 0; }
    else if (m === right) { nx = 1; ny = 0; }
    else if (m === top) { nx = 0; ny = -1; }
    else { nx = 0; ny = 1; }
    b.x += nx * (m + b.r); b.y += ny * (m + b.r);
  } else {
    nx = dx / d; ny = dy / d;
    b.x = cx + nx * b.r; b.y = cy + ny * b.r;
  }
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const tx = b.vx - vn * nx, ty = b.vy - vn * ny;
    b.vx = tx * FRICTION - vn * nx * rest;
    b.vy = ty * FRICTION - vn * ny * rest;
  }
  return true;
}

function collideCircle(b, cx, cy, cr, rest) {
  let dx = b.x - cx, dy = b.y - cy;
  let d = Math.hypot(dx, dy);
  const min = b.r + cr;
  if (d > min) return false;
  if (d < 1e-6) { dx = 0; dy = -1; d = 1; }
  const nx = dx / d, ny = dy / d;
  b.x = cx + nx * min; b.y = cy + ny * min;
  const vn = b.vx * nx + b.vy * ny;
  if (vn < 0) {
    const tx = b.vx - vn * nx, ty = b.vy - vn * ny;
    b.vx = tx * FRICTION - vn * nx * rest;
    b.vy = ty * FRICTION - vn * ny * rest;
  }
  return true;
}

// ---------------------------------------------------------------- update
function step(dt) {
  const left = !!keys.ArrowLeft, right = !!keys.ArrowRight;
  g.animT += dt;
  g.throwT += dt;
  for (const k of ['turnT', 'pickupT', 'celebT', 'breakT']) g[k] = Math.max(0, g[k] - dt);
  if (!g.breakT) g.breakSeq = null;

  if (g.state === STATE.SELECT) return;

  // shot clock
  if (g.clockOn && g.state !== STATE.OVER) {
    g.clock -= dt;
    if (g.clock <= 0) {
      g.clock = 0;
      g.state = STATE.OVER;
      el.ovScore.textContent = `${g.points} points  ·  ${g.made} made`;
      el.overlay.setAttribute('opacity', '1');
    }
  }
  if (g.state === STATE.OVER) return;

  // ---- movement / aiming
  if (g.state === STATE.DRIBBLE || g.state === STATE.LIVE) {
    let vx = 0;
    if (left) vx -= PLAYER_SPEED;
    if (right) vx += PLAYER_SPEED;
    if (vx !== 0) g.facing = Math.sign(vx);
    g.px = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, g.px + vx * dt));
    g.dribT += dt * (vx !== 0 ? 9 : 7);
  } else {
    // aiming: arrows sweep the angle
    if (left) g.angle += AIM_RATE * dt;
    if (right) g.angle -= AIM_RATE * dt;
    g.angle = Math.max(AIM_MIN, Math.min(AIM_MAX, g.angle));
    g.facing = Math.cos(g.angle * Math.PI / 180) >= 0 ? 1 : -1;
  }

  if (g.state === STATE.CHARGE) {
    g.power = Math.min(1, g.power + CHARGE_RATE * dt);
  }

  // ---- ball
  const b = g.ball;
  if (g.state === STATE.DRIBBLE) {
    // dribbling next to the player
    // The ball rises to half a radius above hand height, so the hand rests on
    // its upper quarter. (Stopping at the ball's top -- subtract 2 * BALL_R --
    // is truer to life, but on screen it reads as too short a bounce.)
    const peak = Math.max(6, bodyH() * DRIBBLE_HAND_H - 0.5 * BALL_R);
    const h = Math.abs(Math.sin(g.dribT)) * peak;
    b.x = g.px + bodyH() * 0.26 * ballSide(dribbleSeq());

    // Idle breaks: after a while standing still, the character does something
    // in character. Any movement cancels it, and they never run down the clock.
    const still = !left && !right && g.pickupT <= 0;
    g.stillT = still ? g.stillT + dt : 0;
    if (!still) { g.breakSeq = null; g.breakT = 0; }
    const breaks = Object.keys(curChar ? curChar.sequences : {}).filter(n => n.startsWith('break_'));
    if (still && !g.breakSeq && breaks.length && g.stillT > g.breakAt &&
        (!g.clockOn || g.clock > BREAK_CLOCK_FLOOR)) {
      g.breakSeq = breaks[Math.floor(Math.random() * breaks.length)];
      g.breakT = Math.PI * 2 / 7;        // two bounces, the length of one loop
      g.stillT = 0;
      g.breakAt = BREAK_MIN + Math.random() * (BREAK_MAX - BREAK_MIN);
    }
    b.y = GROUND - BALL_R - h;
    b.spin += dt * 300 * g.facing;
    b.vx = 0; b.vy = 0;
  } else if (g.state === STATE.AIM || g.state === STATE.CHARGE) {
    [b.x, b.y] = holdPos();
  } else {
    // free flight
    g.lockout = Math.max(0, g.lockout - dt);
    const prevY = b.y, prevX = b.x;

    b.vy += G * dt;
    b.vx -= b.vx * AIR * dt;
    b.vy -= b.vy * AIR * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.spin += b.vx * dt * 1.6;

    // walls / ceiling / floor
    if (b.x - b.r < 0) { b.x = b.r; b.vx = -b.vx * REST_WALL; }
    if (b.x + b.r > W) { b.x = W - b.r; b.vx = -b.vx * REST_WALL; }
    if (b.y - b.r < 10) { b.y = 10 + b.r; b.vy = -b.vy * REST_WALL; }
    if (b.y + b.r > GROUND) {
      b.y = GROUND - b.r;
      b.vy = -b.vy * REST_FLOOR;
      b.vx *= 0.94;
      if (Math.abs(b.vy) < 55) { b.vy = 0; }
    }
    if (b.y + b.r >= GROUND - 0.6 && Math.abs(b.vy) < 1 && Math.abs(b.vx) < 12) {
      b.vx = 0; b.rest = true;
    }

    // hoop rig
    collideRect(b, BEAM, REST_BOARD);
    for (const r of BOARDS) collideRect(b, r, REST_BOARD);
    collideCircle(b, HOOP.cx - HOOP.halfW, HOOP.rimY, HOOP.nubR, REST_RIM);
    collideCircle(b, HOOP.cx + HOOP.halfW, HOOP.rimY, HOOP.nubR, REST_RIM);

    // score: centre crosses the rim plane downward, inside the ring
    if (!g.scoredThisShot && prevY < HOOP.rimY && b.y >= HOOP.rimY && b.vy > 0) {
      const t = (HOOP.rimY - prevY) / Math.max(1e-6, b.y - prevY);
      const xAt = prevX + (b.x - prevX) * t;
      if (Math.abs(xAt - HOOP.cx) < HOOP.halfW - HOOP.nubR) {
        g.scoredThisShot = true;
        g.made += 1;
        g.points += POINTS_PER_BASKET;
        g.clockLimit = clockLimitFor(g.points);
        g.clock = g.clockLimit;              // a make also refreshes the clock
        g.flash = 0.5;
        [g.celebSeq, g.celebT] = pickCelebration();
      }
    }

    // auto pickup
    if (g.lockout <= 0) {
      const dx = b.x - g.px, dy = b.y - (GROUND - bodyH() * 0.45);
      if (Math.hypot(dx, dy) < PICKUP_DIST) {
        g.state = STATE.DRIBBLE;
        g.held = true;
        g.dribT = 0;
        g.pickupT = PICKUP_TIME;       // scoop it up off the floor
        g.stillT = 0;
      }
    }
  }

  g.flash = Math.max(0, g.flash - dt);
  toastT = Math.max(0, toastT - dt);
}

// green -> yellow -> red, written as literal rgb() so every renderer agrees
function powerColor(p) {
  const stops = [[63, 191, 95], [232, 200, 60], [226, 87, 43]];
  const t = Math.max(0, Math.min(1, p)) * (stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t)), f = t - i;
  const c = k => Math.round(stops[i][k] + (stops[i + 1][k] - stops[i][k]) * f);
  return `rgb(${c(0)},${c(1)},${c(2)})`;
}

// The dribble frames are indexed off the ball's own bounce phase, so the hand
// always meets the ball. One bounce is dribT advancing by PI. The hand is at its
// LOWEST (frame 1) when the ball is up at the hand, and at its HIGHEST (the
// middle of the sequence) when the ball is down at the floor.
function dribbleFrame(n) {
  const u = (((g.dribT % Math.PI) + Math.PI) % Math.PI) / Math.PI;
  return Math.floor(((((u - 0.5) % 1) + 1) % 1) * n) % n;
}

// Pick the sequence and frame for this tick. Loops run at a handful of frames
// per second -- the heave that old DOS sports games ran on -- except dribbling,
// which follows the ball.
function animatePlayer() {
  g.mirrorPose = false;
  if (!curChar) return;

  const moving = !!keys.ArrowLeft || !!keys.ArrowRight;
  const right = g.facing >= 0;

  if (g.state === STATE.OVER) {
    const name = firstSeq('gameover', 'dribble_idle');
    return showFrame(name, Math.floor(g.animT * ANIM_HZ.gameover) % seqOf(name).length);
  }

  if (g.state === STATE.LIVE) {
    const shot = seqOf('shot');
    if (g.throwT < RISE_HOLD && shot.length >= 3) return showFrame('shot', shot.length - 3);
    if (g.throwT < RELEASE_HOLD) return showFrame('shot', shot.length - 2);
    if (g.throwT < RELEASE_HOLD + FOLLOW_HOLD) return showFrame('shot', shot.length - 1);
    // A celebration yields the moment the player moves: chasing the rebound
    // always matters more than showboating.
    if (g.celebT > 0 && !moving && g.celebSeq && seqOf(g.celebSeq)) {
      const n = seqOf(g.celebSeq).length;
      const hz = CELEB_HZ[g.celebSeq] || CELEB_HZ_DEFAULT;
      const k = Math.floor((n / hz - g.celebT) * hz);
      return showFrame(g.celebSeq, Math.min(n - 1, Math.max(0, k)));
    }
    if (moving) {
      const name = firstSeq(right ? 'run_r' : 'run_l', 'dribble_idle');
      g.mirrorPose = curChar.mirror;
      return showFrame(name, Math.floor(g.animT * ANIM_HZ.run) % seqOf(name).length);
    }
    g.mirrorPose = curChar.mirror;
    return showFrame('dribble_idle', 0);
  }

  if (g.state === STATE.CHARGE) {
    // Not a loop: the coil deepens with the power meter and holds at its
    // deepest. Cycling it made him bob up and down while winding up.
    const n = seqOf('charge').length;
    return showFrame('charge', Math.min(n - 1, Math.floor(g.power * n)));
  }

  if (g.state === STATE.AIM) {
    const turn = seqOf('turn');
    if (g.turnT > 0 && turn) {
      const k = Math.floor((TURN_TIME - g.turnT) / TURN_TIME * turn.length);
      return showFrame('turn', Math.min(turn.length - 1, k));
    }
    const n = seqOf('aim').length;
    return showFrame('aim', Math.floor(g.animT * ANIM_HZ.aim) % n);
  }

  // dribbling
  const pickup = seqOf('pickup');
  if (g.pickupT > 0 && pickup) {
    const k = Math.floor((PICKUP_TIME - g.pickupT) / PICKUP_TIME * pickup.length);
    return showFrame('pickup', Math.min(pickup.length - 1, k));
  }
  // The old-style characters have no left/right art, so their front stance is
  // mirrored to keep the dribbling hand over the ball.
  g.mirrorPose = curChar.mirror;
  const name = dribbleSeq();
  showFrame(name, dribbleFrame(seqOf(name).length));
}

// ---------------------------------------------------------------- render
function render() {
  const b = g.ball;
  el.player.setAttribute('transform', `translate(${g.px.toFixed(1)},${GROUND})`);
  el.player.setAttribute('opacity', g.state === STATE.SELECT ? '0' : '1');
  animatePlayer();                       // sets g.mirrorPose for this frame
  // Characters drawn per direction are never flipped; only the single-facing
  // art turns around.
  const flip = flipsWithFacing() ? g.facing * (g.mirrorPose ? -1 : 1) : 1;
  el.pflip.setAttribute('transform', flip < 0 ? 'scale(-1,1)' : 'scale(1,1)');

  // shadows shrink with height off the floor
  el.shPlayer.setAttribute('cx', g.px.toFixed(1));
  el.shPlayer.setAttribute('rx', (bodyH() * 0.2).toFixed(1));
  const hAir = Math.max(0, Math.min(1, (GROUND - BALL_R - b.y) / 420));
  el.shBall.setAttribute('cx', b.x.toFixed(1));
  el.shBall.setAttribute('rx', (12 * (1 - 0.55 * hAir)).toFixed(1));
  el.shBall.setAttribute('opacity', g.state === STATE.SELECT ? '0'
                                    : (0.20 * (1 - 0.7 * hAir)).toFixed(3));

  const aiming = (g.state === STATE.AIM || g.state === STATE.CHARGE);
  // front arm points at the ball when holding, hangs otherwise
  const armF = aiming ? [HAND_DX + 4, HAND_DY + 6] : [24, -36];
  const armB = aiming ? [HAND_DX - 12, HAND_DY + 12] : [-22, -34];
  for (const [node, bg, [x2, y2]] of [[el.armF, el.armFbg, armF], [el.armB, el.armBbg, armB]]) {
    node.setAttribute('x2', String(x2)); node.setAttribute('y2', String(y2));
    bg.setAttribute('x2', String(x2)); bg.setAttribute('y2', String(y2));
  }

  el.ballg.setAttribute('transform',
    `translate(${b.x.toFixed(1)},${b.y.toFixed(1)}) rotate(${(b.spin % 360).toFixed(1)})`);
  const hidden = g.state === STATE.SELECT ? '0' : '1';
  el.ballg.setAttribute('opacity', hidden);
  el.shPlayer.setAttribute('opacity', g.state === STATE.SELECT ? '0' : '0.22');

  // aim line
  if (aiming) {
    const rad = g.angle * Math.PI / 180;
    const len = 78 + 150 * g.power;
    const [x1, y1] = holdPos();
    const x2 = (x1 + Math.cos(rad) * len).toFixed(1);
    const y2 = (y1 - Math.sin(rad) * len).toFixed(1);
    for (const n of [el.aim, el.aimBg]) {
      n.setAttribute('x1', x1); n.setAttribute('y1', y1);
      n.setAttribute('x2', x2); n.setAttribute('y2', y2);
    }
    el.aimg.setAttribute('opacity', '1');
  } else {
    el.aimg.setAttribute('opacity', '0');
  }

  // power meter
  if (g.state === STATE.CHARGE) {
    // sit the meter on the side the player is NOT aiming towards
    const side = -g.facing;
    const bx = Math.max(8, Math.min(W - 24, g.px + 74 * side - 8)), by = GROUND - 210;
    el.power.setAttribute('opacity', '1');
    el.power.setAttribute('transform', `translate(${bx.toFixed(1)},${by})`);
    const h = 96 * g.power;
    el.pwFill.setAttribute('y', (96 - h).toFixed(1));
    el.pwFill.setAttribute('height', h.toFixed(1));
    el.pwFill.setAttribute('fill', powerColor(g.power));
  } else {
    el.power.setAttribute('opacity', '0');
  }

  el.made.textContent = String(g.made);
  el.pts.textContent = String(g.points);
  el.clock.textContent = g.clock.toFixed(1);
  el.clock.setAttribute('fill', g.clock <= 3 ? '#e2572b' : 'var(--ink)');
  el.pts.setAttribute('fill', g.flash > 0 ? '#3fbf5f' : 'var(--ink)');
  el.toast.setAttribute('opacity', Math.min(1, toastT / 0.4).toFixed(2));
  el.hud.setAttribute('opacity', g.state === STATE.SELECT ? '0' : '1');
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 1 / 30);
  // fixed sub-steps keep fast shots from tunnelling through the rim
  const n = 3, h = dt / n;
  for (let i = 0; i < n; i++) step(h);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// expose for debugging / future sprite work
window.__hoop = { get state(){ return g; }, reset, step, render, keys, STATE, HOOP,
                  startRun, get chars(){ return CHARS; },
                  get shown(){ return shown; }, get char(){ return curChar; },
                  get charIdx(){ return charIdx; }, set charIdx(v){ charIdx = v; } };
})();
</script>
