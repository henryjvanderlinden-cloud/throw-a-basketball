  scale: 1.00
  status: proposed
  refs:
    front: artwork/basketball-players/zombie.png
    back: artwork/basketball-players/Zombie poses/Zombie 003.png
  subject: |
    the undead zombie basketball player in the attached reference image. Match
    that character exactly: sickly grey-green skin, ragged mid-brown hair,
