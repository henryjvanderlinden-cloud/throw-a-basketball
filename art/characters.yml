      view: |
        back view, seen from directly behind, squared away from the viewer and
        looking up toward a basket high in front of him.
      preamble: |
        Frames {first} to {last} are one single motion, coiling deeper each frame.
      poses:
        - >-
            Upright: knees slightly bent, feet planted wide, hands up at chest
            height in front of him (elbows showing at his sides), back
            straight. The beginning of the wind-up.
        - >-
            Crouching: knees clearly bent, hips dropped, hands drawn in closer
            to the chest, shoulders starting to hunch.
        - >-
            Fully coiled: a deep squat, knees wide and deeply bent, hips low,
            back compressed and rounded forward over his thighs, hands tucked
            tight against the chest, loaded and about to spring.
      closing: |
        Frames {first} to {last} are one continuous deepening crouch and will be
        played forwards and then backwards, so the motion must read smoothly in
