          hand_shape: fist
          free: [0.096, 0.435]
          free_shape: fist
          joints: {ank_f: [-0.08, 0.09], ank_d: [-0.04, 0.21], knee_d: [0.08, 0.28], elb_d: [0.216, 0.540], elb_f: [-0.012, 0.570]}
