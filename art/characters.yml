      preamble: |
        The hand on the VIEWER'S RIGHT is dribbling and cycles through four
        fixed positions; the hand on the VIEWER'S LEFT drags his own face
        downward and lets it snap back.

        Throughout all four frames his LEGS ARE CROSSED IN AN X — the knees
        knocked together and crossing over one another while the feet stay
        planted apart on the ground line. It is a slack, boneless stance and he
        does not appear to have noticed it.
      poses:
        - >-
            Dribbling hand pushed all the way down at hip height, palm to
            the floor. Other hand clamped flat over his own face with the
            fingers spread, beginning to drag the flesh downward.
        - >-
            Dribbling hand halfway up, between hip and chest. The face
            hauled WAY down — the skin stretched far past anything a real
            face could do, the eyes and mouth dragged into long droopy
            ovals, the chin pulled down near his chest.
        - >-
            Dribbling hand at its highest, just below chest height. The
            hand has let go and the face is caught mid-snap, rubbery and
            rippling, the features springing back up past where they
            belong.
        - >-
            Dribbling hand dropping back toward the hip. The face has
            settled again, back to normal but sitting very slightly askew,
            the expression completely blank.
      closing: |
        This is a one-shot played between repeats of a dribbling loop. The
        dribbling hand's four positions must exactly match a normal dribbling
        cycle so the motion is continuous.
      extra: |
        His legs stay crossed in the same X in all four frames. Nothing leaves
        his body — the face stretches, it does not come off.

    break_head:
      title: "Idle break B: his head tips too far back"
      kind: one_shot
      frames: 4
      ref: front
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The feet stay planted throughout.
      view: |
        front view, facing the viewer, squared to camera, in a low athletic
        stance with the knees bent.
      preamble: |
        The hand on the VIEWER'S RIGHT is dribbling and cycles through four
        fixed positions; his neck gives way and his head tips backwards far past
        anything a neck should allow, then snaps upright again. The arm on the
        VIEWER'S LEFT simply hangs at his side throughout.
      poses:
        - >-
            Dribbling hand pushed all the way down at hip height, palm to
            the floor. His head beginning to tip backwards, chin rising,
            throat opening up.
        - >-
            Dribbling hand halfway up, between hip and chest. The head
            tipped FAR back past vertical, the neck bent at an impossible
            backward angle and stretched long, the face pointing straight
            up at the ceiling, jaw hanging open.
        - >-
            Dribbling hand at its highest, just below chest height. The
            head caught mid-snap, whipping back forward, the neck rubbery
            and rippling with the recoil and overshot a little too far
            forward.
        - >-
            Dribbling hand dropping back toward the hip. The head upright
            again but sitting a few degrees off true, expression blank.
      closing: |
        This is a one-shot played between repeats of a dribbling loop. The
        dribbling hand's four positions must exactly match a normal dribbling
        cycle so the motion is continuous.
      extra: |
        Only the head and neck move. His shoulders, hips and feet stay exactly
        where they are in all four frames.

    celebrate_collapse:
      title: "Made basket celebration C: falls apart and reassembles"
      kind: one_shot
      frames: 6
      ref: front
      ground: |
        All frames share one ground line: whatever is touching the floor in a
        given frame rests exactly on that line. He stays on the same spot on the
        floor throughout.
      view: |
        front view, facing the viewer.
      preamble: |
        He has just sunk a shot and celebrates so hard that he shakes himself to
        pieces, then puts himself back together. Delighted throughout. Frames
        {first} to {last} are one continuous move.
      poses:
        - >-
            Both arms thrown straight up overhead in triumph, jaw dropped
            wide in a groaning cheer, up on his toes.
        - >-
            Shaking himself apart at the top of the cheer — both arms
            detaching at the shoulders and flying upward, head lifting
            clear of the neck, the torso still upright.
        - >-
            A loose heap on the floor: legs folded, torso toppled across
            them, both arms and the head scattered around him on the
            ground line, the head face-up and still grinning.
        - >-
            Reassembling: the torso rising back onto the legs, one arm
            swinging back toward its shoulder, the head floating up toward
            the neck.
        - >-
            Nearly whole again: both arms reattached but crooked, the head
            settling onto the neck at a slight angle, wobbling upright.
        - >-
            Standing whole, both fists raised at chest height, head
            straight, a wide lipless grin — then easing down into a low
            athletic stance.
      extra: |
        His own detached parts are the only extra elements and all of them stay
        within his own frame.

    panic:
      title: Shot-clock panic
      kind: loop
      frames: 4
      ref: front
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The feet stay planted throughout.
      view: |
        front view, facing the viewer, squared to camera, in a low athletic
        stance with the knees bent.
      preamble: |
        The shot clock is running out. He notices slowly, and reacts wrongly,
        the way a dead thing would — no urgency in the body at all, just the
        eyes and one stiff arm.

        The hand on the VIEWER'S LEFT keeps dribbling through four fixed
        positions. The arm on the VIEWER'S RIGHT comes up toward the clock
        above him, off-screen to the viewer's upper right, straight and stiff
        with the elbow locked, the way a zombie reaches for something.
      poses:
        - >-
            Dribbling hand pushed all the way down at knee height, palm to
            the floor. His head cranking slowly round and up toward the
            VIEWER'S UPPER RIGHT, jaw slack, eyes still normal.
        - >-
            Dribbling hand risen to hip height. His EYES POP OUT of their
            sockets on stalks, shooting out toward the clock in a
            cartoonish bulge, jaw dropping wide open.
        - >-
            Dribbling hand at its highest, just below chest height. The
            stiff arm raised straight out and up toward the clock with the
            elbow locked and the fingers hooked into a claw, eyes still
            out on their stalks, a long groan coming out of him.
        - >-
            Dribbling hand dropping back toward the hip. The eyes sucking
            back into their sockets, the arm still raised and locked, jaw
            still hanging.
      extra: |
        The feet do not move at any point, and the dribbling hand's four
        positions must exactly match a normal dribbling cycle so the motion is
        continuous.
        The popped-out eyes are the only extra element and they stay close to
        his head. There is no sweat — he does not sweat.

