    break_hair:
      title: "Idle break B: fixing the hair"
      kind: one_shot
      frames: 4
      ref: front
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The feet stay planted throughout.
      view: |
        front view, facing the viewer, squared to camera, in a low athletic
        stance with the knees bent.
      preamble: |
        The hand on the VIEWER'S RIGHT is dribbling and cycles through four
        fixed positions; the hand on the VIEWER'S LEFT deals with his fringe,
        which he considers more urgent than the game.
      poses:
        - >-
            Dribbling hand pushed all the way down at hip height, palm to
            the floor. Hair fallen forward right over his eyes, other hand
            starting to come up, mouth pulled to one side in annoyance.
        - >-
            Dribbling hand halfway up, between hip and chest. Other hand
            raking back through the fringe, head tipped back, eyes shut.
        - >-
            Dribbling hand at its highest, just below chest height. Hair
            swept up and back into a dramatic quiff, other hand smoothing
            it down, chin lifted, looking extremely pleased with the
            result.
        - >-
            Dribbling hand dropping back toward the hip. Other arm back at
            his side — and the fringe has already flopped straight back
            down over his eyes.
      closing: |
        This is a one-shot played between repeats of a dribbling loop. The
        dribbling hand's four positions must exactly match a normal dribbling
        cycle so the motion is continuous.

    celebrate_dab:
      title: "Made basket celebration C: can't hear you, then a dab"
      kind: one_shot
      frames: 5
      ref: front
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. He stays on the same spot on the floor
        throughout.
      view: |
        front view, facing the viewer.
      preamble: |
        He has just sunk a shot and is playing to a crowd that may or may not be
        paying him any attention: first cupping a hand to his ear fishing for
        applause, then dropping a dab. Frames {first} to {last} are one
        continuous move.
      poses:
        - >-
            Standing up out of his stance, one arm flung straight out to
            the VIEWER'S LEFT with the finger pointing at the crowd, the
            other hand cupped open behind his ear, leaning that way, mouth
            open — let's hear it.
        - >-
            Leaning the other way: the pointing arm swung across to the
            VIEWER'S RIGHT, the cupped hand still held at his ear, head
            cocked, grinning, still fishing for noise.
        - >-
            The wind-up: both arms swinging in and across his chest
            together, knees bending, head starting to drop toward one
            elbow.
        - >-
            THE DAB: his head dropped and buried in the crook of his bent
            elbow, that arm folded flat across his chest, and the OTHER
            arm extended straight out and up along exactly the same
            diagonal line so that both arms are parallel. Held still.
        - >-
            Coming out of it: head lifting back up, both arms unfolding
            down to his sides, a very pleased grin, settling back into a
            low athletic stance.
      extra: |
        In the dab both arms point the SAME way along one straight diagonal and
        the face is hidden in the crook of the folded elbow — that alignment is
        the whole pose, and without it the frame reads as a stumble.

    panic:
      title: Shot-clock panic
      kind: loop
      frames: 4
      ref: front
      # Rick asked for both hands on his head. Only one can go there — the other
      # has to keep the dribble cycle or the ball is stranded — and the shape
      # survives with one arm.
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The feet stay planted throughout.
      view: |
        front view, facing the viewer, squared to camera, in a low athletic
        stance with the knees bent.
      preamble: |
        The shot clock is running out and he is coming apart about it. Eyes huge
        and round, brows right up, mouth open, sweat flying off his hair.

        The hand on the VIEWER'S LEFT keeps dribbling through four fixed
        positions. The arm on the VIEWER'S RIGHT grabs at his own head. His head
        is turned up and to the VIEWER'S RIGHT throughout, staring off-screen at
        a clock above him.
      poses:
        - >-
            Dribbling hand pushed all the way down at knee height, palm to
            the floor. Head snapped up and round toward the clock, eyes
            going wide. Other hand starting up toward his hair.
        - >-
            Dribbling hand risen to hip height. Other hand clamped flat on
            top of his head with the fingers dug into his hair, shoulders
            hunched up around his ears, mouth open in a wail.
        - >-
            Dribbling hand at its highest, just below chest height. That
            arm shot straight UP above his head with the fingers splayed,
            his whole body stretching up tall out of the crouch, eyes
            bulging, sweat flying.
        - >-
            Dribbling hand dropping back toward the hip. The raised arm
            dropping back onto his head, knees bending again as he sinks
            back into the crouch, still wailing.
      extra: |
        The feet do not move at any point, and the dribbling hand's four
        positions must exactly match a normal dribbling cycle so the motion is
        continuous.
        The body clearly rises and falls across the four frames. Sweat beads
        are the only extra element, and they stay close to his head.


