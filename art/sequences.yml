  # --- personality ---------------------------------------------------------

  celebrate:
    title: Made basket celebration A — arms overhead
    kind: one_shot
    frames: 2
    ref: front
    ground: |
      Frames {f1} and {f2} share one ground line: in frame {f1} he is up on
      his toes on that line, in frame {f2} his soles are flat on it.
    view: |
      front view, facing the viewer.
    poses:
      - >-
          Triumph: both arms thrown straight up overhead, up on the toes,
          head back, mouth wide open mid-shout, eyes screwed shut with
          delight. {trail_high}
      - >-
          Settling: arms coming back down, one fist pumped at chest
          height, a wide grin, weight dropping back into a low athletic
          stance. {trail_lower}

  celebrate_pump:
    title: Made basket celebration B — low fist pump
    kind: one_shot
    frames: 3
    ref: front
    ground: |
      All frames share one ground line: the soles of both feet touch the same
      horizontal line in every frame, and the feet stay planted throughout.
    view: |
      front view, facing the viewer.
    preamble: |
      He has just sunk a shot and is quietly pleased with himself — cocky rather
      than ecstatic. This must read as a DIFFERENT reaction from the arms-
      overhead celebration, not a smaller version of it. Nothing goes above his
      chest.
    poses:
      - >-
          Standing up out of his stance, both fists clenched at chest
          height, chin lifted, one eyebrow raised, a smug closed-mouth
          smirk. {trail_curl}
      - >-
          The pump: one fist driven sharply down and back to hip height,
          elbow tucked in tight to his side, shoulders hunched forward,
          knees bent, teeth bared in a sharp grin. The other fist stays at
          his chest.
      - >-
          Settling: the fist relaxing back up toward the waist, shoulders
          dropping, weight easing back into a low athletic stance, still
          grinning.

  gameover:
    title: Game over, panting
    kind: loop
    frames: 2
    ref: front
    ground: |
      Frames {f1} and {f2} share one ground line: the soles of both feet touch
      the same horizontal line.
    view: |
      front view, facing the viewer. In BOTH frames he is doubled
      over, exhausted, bent forward at the waist with BOTH PALMS PLANTED FLAT ON
      HIS OWN BENT KNEES, elbows locked out, propping himself up. {trail_limp}
      The feet, legs and the hands-on-knees are in EXACTLY the same position in
      both frames — do not let the arms hang loose.
    critical: |
      Frames {f1} and {f2} differ in ONE thing: how high his shoulders and head
      are. That difference must be large and unmistakable, because it is
      the whole animation.
    poses:
      - >-
          EXHALED, at his lowest: shoulders dropped right down, back
          deeply rounded and hunched, chest collapsed, head hanging
          straight down toward the floor. {spent_low}
      - >-
          INHALING, at his highest: shoulders heaved right up around his
          ears, back arched, chest puffed out wide, head lifted so the
          face points forward, mouth wide open gasping for air.

