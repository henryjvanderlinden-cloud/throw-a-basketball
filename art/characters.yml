            drop: 0.12
            tilt: 0.01
            lean: 0.012
            stance: 0.27
            hand: 0.30
            palm: 8
            yaw: -40
            free: [-0.38, 0.93]
            free_shape: open
      ground: |
        All frames share one ground line: the soles of the feet touch the same
        horizontal line in every frame. The feet stay planted throughout.
      view: |
        front view, facing the viewer, squared to camera, in a low athletic
        stance with the knees bent.
      preamble: |
        The shot clock is running out. He notices slowly, and reacts wrongly,
        the way a dead thing would -- no urgency in the body at all, just the
        eyes and one stiff arm.

        The hand on the VIEWER'S LEFT is dribbling a basketball: palm to the
        floor, HIGH in frames {f1} and {f3}, pushed LOW in frames {f2} and
        {f4}. His head is turned up toward the VIEWER'S UPPER RIGHT in every
        frame, where the clock is, off-screen above him. The arm on the
        VIEWER'S RIGHT hangs until frame {f3}, then comes up toward the clock,
        straight and stiff with the elbow locked, the way a zombie reaches for
        something.
      poses:
        - >-
            Dribbling hand high. His head cranked slowly round and up toward
            the VIEWER'S UPPER RIGHT, jaw slack, eyes still normal. The other
            arm hangs.
        - >-
            Dribbling hand pushed low. His EYES POP OUT of their sockets on
            stalks, bulging out toward the clock cartoon-style, jaw dropping
            wide open. The other arm still hangs.
        - >-
            Dribbling hand high. The stiff arm raised straight out and up
            toward the clock, elbow locked, fingers hooked into a claw, eyes
            still far out on their stalks, a long groan coming out of him.
        - >-
            Dribbling hand pushed low. The arm still raised and locked at the
            clock, the eyes sucked most of the way back toward their sockets,
            jaw still hanging.
      closing: |
        Frames {f1} to {f4} play once, in order. After that the game keeps
        alternating frames {f3} and {f4} until the clock is reset, so those
        two differ ONLY in the dribbling hand and in how far the eyes stick
        out: the raised arm, the head and the body are identical in both.
      extra: |
        The feet do not move at any point, and frames {f1} and {f3} have the
        dribbling hand in exactly the same place, as do frames {f2} and {f4}.
        The popped-out eyes are the only extra element and they stay close to
        his head. There is no sweat -- he does not sweat. No basketball is
        drawn: the game draws the ball separately.

    # --- the shooting chain (handover 09) -----------------------------------
    # The zombie's own copies of the shared turn / aim / charge / shot, made
    # to match the MONKEY'S approved frames like for like (Rick, 2026-09-25:
    # "every image in the four sequences read very well, so try to match them
    # like for like"). Same frame counts, same poses, same back view. The
    # ball is not in his hands in any of them: the game draws it above his
    # head at the launch point, and that reads fine.
    #
    # THE GUIDES ARE THE MONKEY'S POSES, measured off sprites/monkey/<seq>
    # against a grid in shares of his standing height (his dribble, 116, taken
    # as 0.98 of it, as the zombie's is) and carried over onto the zombie's
    # skeleton: head-top height -> `drop`, feet -> `stance`, elbows and hands
    # from the grid. Head-top heights, monkey: turn .97 .96; aim .97 .93;
    # charge .97 .86 .73; shot .73 .94 .98 .97, with the hands at 1.02 (rise),
    # 1.20 (release, up on the toes) and 1.10 (follow-through).
    #
    # The shared prose's tail and coil traits are left out on purpose: the
    # zombie's own coil traits ("spine folded over at an unnatural angle")
    # would take the charge away from the monkey's.
    turn:
      title: Turn to shoot
      kind: one_shot
      frames: 2
      ref: front
      guide:
        file: art/guides/turn.png
        side: right
        colors: true
        ears: true
        nose: true
        note: &backnote |
          POSE GUIDE: TWO images are attached, and they do different jobs.

          The COLOUR image of the character is the only authority on WHO HE
          IS. His colours, his proportions, his build, his height, his face,
          his kit and the drawing style all come from that image and from the
          SUBJECT above, and nothing below changes any of them. It does NOT
          decide which way he faces: the FRAMES below do.

          The other image is a POSE GUIDE: a stick figure on a white
          background, standing in a row on one ground line, in the same
          left-to-right order as the FRAMES listed below. The Nth figure in
          the pose guide is the pose for the Nth frame. Take the GEOMETRY from
          it and only the geometry: where each foot stands on the ground line,
          how deeply the knees are bent, how low the shoulders and head are,
          and where the elbows and hands are. Where the words below and the
          pose guide describe the same thing, they agree; the pose guide is
          the exact version of it.

          THE COLOURS ON THE POSE GUIDE name the limbs: the RED arm and the
          ORANGE leg are on the VIEWER'S RIGHT, the BLUE arm and the GREEN leg
          on the viewer's left.

          THE HEAD ON THE POSE GUIDE: in the first figure the upright line and
          the level line mark the centre of his face, looking at the viewer. A
          head with a small TRIANGLE jutting out of one side is seen in
          profile: the triangle is his nose, pointing the way he looks. A head
          with THREE CURVED STROKES across it and an oval on each side has NO
          face: we are looking at the BACK of his head, the strokes are the
          hair on the back of his skull, the ovals his two ears.

          SEEN FROM BEHIND, his hands are in FRONT of his body, so where the
          pose guide puts them in front of his chest they are hidden from the
          viewer by his own back: only the elbows, sticking out to either
          side, show that his arms are bent and raised.

          Draw the character from the colour reference standing in those
          positions. The pose guide is an instruction, not artwork: its thin
          lines, its colours, its joint dots, its white background, its
          circular head, its triangle, its ovals and its strokes are NOT part
          of the drawing and must not appear anywhere in it.
        frames:
          - {pose: calibration}
          - name: half-turned
            yaw: 90
            turn: 55
            drop: 0.04
            stance: 0.19
            hand: [0.25, 0.43]
            hand_shape: hang
            free: [-0.25, 0.43]
          - name: turned
            back: true
            drop: 0.05
            stance: 0.20
            hand: [0.08, 0.61]
            hand_shape: fist
            free: [-0.08, 0.61]
            free_shape: fist
            joints: {elb_d: [0.21, 0.58], elb_f: [-0.21, 0.58]}
      view: |
        the character turning on the spot, away from the viewer.
      poses:
        - >-
            Halfway through the turn: a three-quarter view from behind,
            shoulders rotated away from the viewer so that we see most of his
            back and the number on it, feet pivoting wide apart with the knees
            bent, both arms hanging out a little from his sides with the hands
            open at hip height. His head is turned to the VIEWER'S RIGHT in
            profile, lifting to look up and away over his shoulder.
        - >-
            Almost fully turned: his back square to the viewer, knees bent in
            a wide shooting stance, both elbows bent and sticking out to his
            sides with the hands up in front of his chest, out of sight. The
            back of his head toward the viewer, tilted up.
      closing: |
        This is a one-shot, not a loop. Frame {first} must continue naturally from
        a front view facing the viewer; frame {last} must settle into a back view
        squared away from the viewer.

